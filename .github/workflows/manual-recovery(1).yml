name: Manual Recovery - XAUTUSD Paper State
run-name: Manual Recovery - XAUTUSD Paper State

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Older successful Setup A run ID that contains the checkpoint you want to restore'
        required: true
        type: string
      source_attempt:
        description: 'Attempt number that created that checkpoint (usually 1)'
        required: true
        type: string
      confirmation:
        description: 'Type RESTORE_XAUTUSD_PAPER_STATE to approve this Paper-state rollback'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: xaut-manual-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  approve-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify selected source and latest blocked run
        id: verify_source
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::Source run ID must be numeric."; exit 1; }
          [[ "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::Source attempt must be a positive integer."; exit 1; }
          [[ "$CONFIRMATION" == "RESTORE_XAUTUSD_PAPER_STATE" ]] || { echo "::error::Exact recovery confirmation is missing."; exit 1; }

          WORKFLOW_PATH=".github/workflows/setup-a.yml"
          RUNS_JSON="$(gh api --method GET --paginate --slurp \
            -f "branch=${GITHUB_REF_NAME}" -f "event=workflow_dispatch" -F "per_page=100" \
            "repos/${GITHUB_REPOSITORY}/actions/runs")"

          # Refuse approval while any Setup A run on this branch is active.
          ACTIVE_SETUP_RUNS="$(printf '%s' "$RUNS_JSON" | jq -r --arg workflow "$WORKFLOW_PATH" --arg branch "$GITHUB_REF_NAME" '
            [.[].workflow_runs[]?
             | select(.head_branch == $branch)
             | select(.event == "workflow_dispatch")
             | select(((.path // "") | split("@")[0]) == $workflow)
             | select(.status != "completed")]
            | length
          ')"
          if [[ "$ACTIVE_SETUP_RUNS" != "0" ]]; then
            echo "::error::A Setup A run is still active on this branch. Wait until it finishes before approving recovery."
            exit 1
          fi

          # Only the newest Setup A run may be the blocked target. Never skip a
          # newer successful run and roll state back against an older failure.
          LATEST_SETUP_RUN_JSON="$(printf '%s' "$RUNS_JSON" | jq -c --arg workflow "$WORKFLOW_PATH" --arg branch "$GITHUB_REF_NAME" '
            [.[].workflow_runs[]?
             | select(.head_branch == $branch)
             | select(.event == "workflow_dispatch")
             | select(((.path // "") | split("@")[0]) == $workflow)]
            | sort_by(.created_at, .id)
            | last // empty
          ')"
          [[ -n "$LATEST_SETUP_RUN_JSON" ]] || { echo "::error::No Setup A run was found on this branch."; exit 1; }

          BLOCKED_RUN_ID="$(printf '%s' "$LATEST_SETUP_RUN_JSON" | jq -r '.id | tostring')"
          BLOCKED_RUN_ATTEMPT="$(printf '%s' "$LATEST_SETUP_RUN_JSON" | jq -r '.run_attempt | tostring')"
          BLOCKED_CREATED_AT="$(printf '%s' "$LATEST_SETUP_RUN_JSON" | jq -r '.created_at')"
          LATEST_STATUS="$(printf '%s' "$LATEST_SETUP_RUN_JSON" | jq -r '.status // ""')"
          LATEST_CONCLUSION="$(printf '%s' "$LATEST_SETUP_RUN_JSON" | jq -r '.conclusion // ""')"

          [[ "$LATEST_STATUS" == "completed" ]] || { echo "::error::The latest Setup A run is not completed; manual recovery is blocked."; exit 1; }
          case "$LATEST_CONCLUSION" in
            failure|cancelled|timed_out) ;;
            *) echo "::error::The latest Setup A run did not fail, cancel, or time out. No manual recovery is authorized."; exit 1 ;;
          esac

          [[ "$SOURCE_RUN_ID" != "$BLOCKED_RUN_ID" ]] || { echo "::error::Choose an older source run, not the blocked run itself."; exit 1; }

          # Confirm the precise blocked attempt, not merely the run's latest metadata.
          BLOCKED_ATTEMPT_JSON="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${BLOCKED_RUN_ID}/attempts/${BLOCKED_RUN_ATTEMPT}")"
          printf '%s' "$BLOCKED_ATTEMPT_JSON" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg workflow "$WORKFLOW_PATH" \
            --arg run_id "$BLOCKED_RUN_ID" \
            --arg attempt "$BLOCKED_RUN_ATTEMPT" '
              (.id | tostring) == $run_id and
              (.run_attempt | tostring) == $attempt and
              .repository.full_name == $repo and
              .head_branch == $branch and
              .event == "workflow_dispatch" and
              .status == "completed" and
              (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") and
              ((.path // "") | split("@")[0]) == $workflow
            ' >/dev/null || {
              echo "::error::The latest Setup A attempt could not be verified as a failed/cancelled/timed-out attempt."
              exit 1
            }

          BLOCKED_ARTIFACTS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${BLOCKED_RUN_ID}/artifacts?per_page=100")"
          BLOCKED_MARKER_NAME="xaut-run-started-a${BLOCKED_RUN_ATTEMPT}"
          BLOCKED_STATE_NAME="xaut-paper-state-a${BLOCKED_RUN_ATTEMPT}"
          HAS_BLOCKED_MARKER="$(printf '%s' "$BLOCKED_ARTIFACTS" | jq -r --arg marker "$BLOCKED_MARKER_NAME" --arg run_id "$BLOCKED_RUN_ID" '
            any(.artifacts[]?; .name == $marker and .expired == false and (.workflow_run.id | tostring) == $run_id)
          ')"
          HAS_BLOCKED_STATE="$(printf '%s' "$BLOCKED_ARTIFACTS" | jq -r --arg state "$BLOCKED_STATE_NAME" --arg run_id "$BLOCKED_RUN_ID" '
            any(.artifacts[]?; .name == $state and .expired == false and (.workflow_run.id | tostring) == $run_id)
          ')"
          [[ "$HAS_BLOCKED_MARKER" == "true" ]] || { echo "::error::The latest failed Setup A attempt has no matching bot-start marker; recovery is not proven necessary."; exit 1; }
          [[ "$HAS_BLOCKED_STATE" == "false" ]] || { echo "::error::The latest failed Setup A attempt already has a Paper-state checkpoint artifact; manual rollback is not authorized."; exit 1; }

          # Use the attempt-specific endpoint. The ordinary run endpoint describes
          # the latest attempt and can misidentify a previously selected attempt.
          SOURCE_ATTEMPT_JSON="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_ATTEMPT}")"
          SOURCE_RUN_META="$RUNNER_TEMP/xaut-manual-source-attempt.json"
          printf '%s' "$SOURCE_ATTEMPT_JSON" > "$SOURCE_RUN_META"
          printf '%s' "$SOURCE_ATTEMPT_JSON" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg workflow "$WORKFLOW_PATH" \
            --arg attempt "$SOURCE_ATTEMPT" \
            --arg blocked_at "$BLOCKED_CREATED_AT" \
            --arg source_id "$SOURCE_RUN_ID" '
              (.id | tostring) == $source_id and
              .repository.full_name == $repo and
              .head_branch == $branch and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              ((.path // "") | split("@")[0]) == $workflow and
              (.run_attempt | tostring) == $attempt and
              (.created_at < $blocked_at)
            ' >/dev/null || {
              echo "::error::Source must be an older, successful Setup A attempt on this same branch, with the exact selected attempt."
              exit 1
            }

          SOURCE_ARTIFACT_NAME="xaut-paper-state-a${SOURCE_ATTEMPT}"
          SOURCE_MARKER_NAME="xaut-run-started-a${SOURCE_ATTEMPT}"
          SOURCE_ARTIFACTS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          printf '%s' "$SOURCE_ARTIFACTS" | jq -e \
            --arg state "$SOURCE_ARTIFACT_NAME" \
            --arg marker "$SOURCE_MARKER_NAME" \
            --arg run_id "$SOURCE_RUN_ID" '
              ([.artifacts[]? | select(.name == $state and .expired == false and (.workflow_run.id | tostring) == $run_id)] | length) == 1 and
              ([.artifacts[]? | select(.name == $marker and .expired == false and (.workflow_run.id | tostring) == $run_id)] | length) == 1
            ' >/dev/null || {
              echo "::error::The selected source attempt must have exactly one unexpired state artifact and one unexpired bot-start marker artifact."
              exit 1
            }

          SOURCE_DIR="$RUNNER_TEMP/xaut-manual-source"
          MARKER_DIR="$RUNNER_TEMP/xaut-manual-marker"
          rm -rf "$SOURCE_DIR" "$MARKER_DIR"
          mkdir -p "$SOURCE_DIR" "$MARKER_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT_NAME" --dir "$SOURCE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_MARKER_NAME" --dir "$MARKER_DIR"

          export SOURCE_DIR MARKER_DIR SOURCE_RUN_ID SOURCE_ATTEMPT SOURCE_ARTIFACT_NAME
          export SOURCE_RUN_META
          export BLOCKED_RUN_ID BLOCKED_RUN_ATTEMPT BLOCKED_CREATED_AT
          python - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIR"])
          marker_dir = Path(os.environ["MARKER_DIR"])
          allowed = {
              "paper_state.json",
              "alert_state.json",
              "trade_history.csv",
              "trade_history_legacy.csv",
              "execution_journal.json",
          }

          def fail(message):
              raise SystemExit(f"MANUAL RECOVERY VALIDATION FAILED: {message}")

          def read_json(path):
              if path.is_symlink() or not path.is_file():
                  fail(f"not a regular JSON file: {path.name}")
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except Exception as error:
                  fail(f"cannot parse {path.name}: {error!r}")
              if not isinstance(value, dict):
                  fail(f"JSON root must be an object: {path.name}")
              return value

          for base in (source, marker_dir):
              for path in base.rglob("*"):
                  if path.is_symlink() or not path.is_file():
                      fail(f"unexpected non-regular artifact entry: {path.relative_to(base)}")

          marker_files = [p for p in marker_dir.iterdir() if p.is_file()]
          if len(marker_files) != 1 or marker_files[0].name != "xaut-run-started.json":
              fail("bot-start marker artifact must contain exactly xaut-run-started.json")
          marker = read_json(marker_files[0])
          if str(marker.get("workflow_run_id", "")) != os.environ["SOURCE_RUN_ID"]:
              fail("bot-start marker run ID does not match selected source")
          if str(marker.get("workflow_run_attempt", "")) != os.environ["SOURCE_ATTEMPT"]:
              fail("bot-start marker attempt does not match selected source")
          if marker.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              fail("bot-start marker repository mismatch")
          if marker.get("branch") != os.environ["GITHUB_REF_NAME"]:
              fail("bot-start marker branch mismatch")

          manifest_path = source / "state_manifest.json"
          manifest = read_json(manifest_path)
          if manifest.get("schema_version") != 1:
              fail("unsupported checkpoint manifest schema")
          if manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
              fail("checkpoint symbol/product mismatch")
          if manifest.get("mode") != "PAPER":
              fail("only Paper-mode checkpoints can be manually recovered")
          run_meta = manifest.get("run")
          if not isinstance(run_meta, dict):
              fail("checkpoint run metadata is missing")
          source_run_meta = read_json(Path(os.environ["SOURCE_RUN_META"]))
          if str(source_run_meta.get("id", "")) != os.environ["SOURCE_RUN_ID"]:
              fail("GitHub source attempt metadata ID mismatch")
          if str(source_run_meta.get("run_attempt", "")) != os.environ["SOURCE_ATTEMPT"]:
              fail("GitHub source attempt metadata attempt mismatch")
          if source_run_meta.get("head_sha") != run_meta.get("runner_commit_sha"):
              fail("checkpoint runner commit does not match the selected GitHub source attempt")
          if str(run_meta.get("workflow_run_id", "")) != os.environ["SOURCE_RUN_ID"]:
              fail("checkpoint manifest run ID mismatch")
          if str(run_meta.get("workflow_run_attempt", "")) != os.environ["SOURCE_ATTEMPT"]:
              fail("checkpoint manifest attempt mismatch")
          if run_meta.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              fail("checkpoint manifest repository mismatch")
          if run_meta.get("ref_name") != os.environ["GITHUB_REF_NAME"]:
              fail("checkpoint manifest branch mismatch")
          marker_bot_commit = marker.get("bot_commit_sha") or marker.get("bot_commit")
          manifest_bot_commit = run_meta.get("bot_commit_sha")
          if not isinstance(marker_bot_commit, str) or not marker_bot_commit.strip():
              fail("bot-start marker is missing bot commit SHA")
          if not isinstance(manifest_bot_commit, str) or not manifest_bot_commit.strip():
              fail("checkpoint manifest is missing bot commit SHA")
          if marker_bot_commit != manifest_bot_commit:
              fail("bot source commit differs between marker and checkpoint manifest")

          records = manifest.get("files")
          if not isinstance(records, dict) or "paper_state.json" not in records:
              fail("manifest does not contain required paper_state.json")
          names = set(records)
          if not names.issubset(allowed):
              fail(f"manifest contains unexpected files: {sorted(names - allowed)}")
          actual_names = {p.name for p in source.iterdir() if p.is_file()}
          expected_names = names | {"state_manifest.json"}
          if actual_names != expected_names:
              fail(f"artifact file set mismatch; expected {sorted(expected_names)}, found {sorted(actual_names)}")

          def validate_payload(name):
              path = source / name
              if path.is_symlink() or not path.is_file():
                  fail(f"checkpoint file missing/not regular: {name}")
              if name == "paper_state.json":
                  data = read_json(path)
                  if data.get("version") not in (1, 2) or data.get("symbol") != "XAUTUSD":
                      fail("Paper state version/symbol mismatch")
                  if int(data.get("product_id", -1)) != 131253 or not isinstance(data.get("state"), dict):
                      fail("Paper state product/body mismatch")
                  state = data["state"]
                  position = float(state.get("position"))
                  if not math.isfinite(position) or position not in (-1.0, 0.0, 1.0):
                      fail("Paper position is invalid")
                  if state.get("pending_csv_trade") is not None:
                      fail("Paper CSV outbox is unresolved")
              elif name == "alert_state.json":
                  data = read_json(path)
                  if data.get("version") != 1 or not isinstance(data.get("active_incidents"), dict) or not isinstance(data.get("queue"), list):
                      fail("alert state structure is invalid")
              elif name == "trade_history.csv":
                  with path.open("r", newline="", encoding="utf-8") as handle:
                      reader = csv.DictReader(handle)
                      expected = ["symbol", "mode", "direction", "quantity", "entry_time_utc", "exit_time_utc", "entry_price", "exit_price", "price_points", "cumulative_points", "exit_reason"]
                      if reader.fieldnames != expected:
                          fail("trade-history CSV header mismatch")
                      for _ in reader:
                          pass
              elif name == "trade_history_legacy.csv":
                  with path.open("r", newline="", encoding="utf-8-sig") as handle:
                      if not next(csv.reader(handle), None):
                          fail("legacy trade-history CSV has no header")
              elif name == "execution_journal.json":
                  data = read_json(path)
                  if data.get("version") != 1 or data.get("symbol") != "XAUTUSD" or int(data.get("product_id", -1)) != 131253:
                      fail("execution journal schema/identity mismatch")
                  managed = float(data.get("managed_position", 0))
                  if not math.isfinite(managed) or managed != 0:
                      fail("Paper recovery refuses a non-flat live execution journal")
                  if data.get("pending_order") is not None:
                      fail("Paper recovery refuses an unresolved live order intent")

          for name, record in records.items():
              if not isinstance(record, dict):
                  fail(f"invalid manifest record: {name}")
              validate_payload(name)
              path = source / name
              if record.get("sha256") != hashlib.sha256(path.read_bytes()).hexdigest():
                  fail(f"SHA-256 mismatch for {name}")
              if int(record.get("size_bytes", -1)) != path.stat().st_size:
                  fail(f"file-size mismatch for {name}")

          print("SOURCE CHECKPOINT VERIFIED:", ", ".join(sorted(expected_names)))

          approved_dir = Path("approved-recovery")
          if approved_dir.exists():
              shutil.rmtree(approved_dir)
          approved_dir.mkdir(parents=True)
          for name in sorted(expected_names):
              shutil.copy2(source / name, approved_dir / name)

          approval_files = {}
          for name in sorted(expected_names):
              path = approved_dir / name
              approval_files[name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              }

          approval = {
              "schema_version": 1,
              "approved": True,
              "mode": "PAPER",
              "symbol": "XAUTUSD",
              "product_id": 131253,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "target_branch": os.environ["GITHUB_REF_NAME"],
              "approved_by": os.environ["GITHUB_ACTOR"],
              "recovery_run_id": os.environ["GITHUB_RUN_ID"],
              "recovery_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "blocked_run_id": os.environ["BLOCKED_RUN_ID"],
              "blocked_run_attempt": os.environ["BLOCKED_RUN_ATTEMPT"],
              "blocked_run_created_at": os.environ["BLOCKED_CREATED_AT"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_run_attempt": os.environ["SOURCE_ATTEMPT"],
              "source_artifact_name": os.environ["SOURCE_ARTIFACT_NAME"],
              "source_bot_commit_sha": run_meta.get("bot_commit_sha", ""),
              "approved_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "files": approval_files,
          }
          (approved_dir / "manual_recovery_approval.json").write_text(
              json.dumps(approval, separators=(",", ":")), encoding="utf-8"
          )
          print("MANUAL RECOVERY APPROVAL BUNDLE PREPARED.")
          print("Blocked run:", os.environ["BLOCKED_RUN_ID"], "attempt", os.environ["BLOCKED_RUN_ATTEMPT"])
          print("Source checkpoint:", os.environ["SOURCE_RUN_ID"], "attempt", os.environ["SOURCE_ATTEMPT"])
          PY

          echo "blocked_run_id=${BLOCKED_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "blocked_run_attempt=${BLOCKED_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "source_run_id=${SOURCE_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "source_attempt=${SOURCE_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload approved recovery checkpoint
        id: upload_recovery
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: xaut-manual-recovery-approved-a${{ github.run_attempt }}
          path: approved-recovery/
          if-no-files-found: error
          retention-days: 30

      - name: Verify approved recovery artifact is available
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload_recovery.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: xaut-manual-recovery-approved-a${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED=false
          for attempt in 1 2 3 4 5; do
            if ARTIFACTS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" 2>/dev/null)"; then
              if printf '%s' "$ARTIFACTS" | jq -e --arg id "$EXPECTED_ARTIFACT_ID" --arg name "$EXPECTED_ARTIFACT_NAME" --arg run "$GITHUB_RUN_ID" '
                any(.artifacts[]?; (.id | tostring) == $id and .name == $name and .expired == false and (.workflow_run.id | tostring) == $run)
              ' >/dev/null; then
                VERIFIED=true
                break
              fi
            fi
            sleep $((attempt * 2))
          done
          [[ "$VERIFIED" == true ]] || { echo "::error::Uploaded recovery artifact could not be verified."; exit 1; }
          {
            echo "### Manual recovery checkpoint approved"
            echo "Blocked Setup A run: \`${{ steps.verify_source.outputs.blocked_run_id }}\` attempt \`${{ steps.verify_source.outputs.blocked_run_attempt }}\`"
            echo "Selected source checkpoint: \`${{ steps.verify_source.outputs.source_run_id }}\` attempt \`${{ steps.verify_source.outputs.source_attempt }}\`"
            echo "Artifact: \`${EXPECTED_ARTIFACT_NAME}\`"
            echo "The next Setup A run may use this approval only for the exact blocked run and attempt recorded above."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Approved recovery artifact verified and ready for the matching Setup A run."
