name: Run XAUT Bot

on:
  workflow_dispatch:
    inputs:
      enable_live_trading:
        description: "Enable REAL trading (use demo first)"
        required: true
        type: boolean
        default: false
      runtime_minutes:
        description: "Bot runtime in minutes (use 5 for a short test; default is 350)"
        required: true
        type: choice
        options:
          - "5"
          - "10"
          - "30"
          - "60"
          - "120"
          - "350"
        default: "350"

permissions:
  contents: read

concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private bot
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Verify private durable recovery branch
        env:
          GH_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="mishraarvind463-del/xaut-bot"
          BRANCH="xaut-recovery-state"
          echo "Checking private durable recovery repository: ${REPO}."
          gh api "repos/${REPO}" --jq '{full_name: .full_name, default_branch: .default_branch, private: .private}'

          if gh api "repos/${REPO}/branches/${BRANCH}" >/dev/null 2>&1; then
            echo "Private recovery branch already exists: ${BRANCH}"
          else
            echo "Private recovery branch is not present. It must first be created by the one-time migration workflow in xaut-bot."
            echo "Refusing to initialize an empty private branch because that could hide unmigrated public recovery data."
            exit 1
          fi

      - name: Confirm private recovery branch contains migrated state
        env:
          GH_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="mishraarvind463-del/xaut-bot"
          BRANCH="xaut-recovery-state"
          if ! gh api "repos/${REPO}/contents/runtime-state/PRIVATE_STORAGE_MIGRATION.json?ref=${BRANCH}" >/dev/null 2>&1; then
            echo "ERROR: private recovery migration manifest is missing. Complete and verify the one-time migration first."
            exit 1
          fi
          echo "Private storage migration manifest found."
          for FILE in \
            runtime-state/bot_recovery_state.json \
            runtime-state/trade_history.csv \
            runtime-state/ai_memory.json \
            runtime-state/shadow_trade_journal.jsonl.gz; do
            if gh api "repos/${REPO}/contents/${FILE}?ref=${BRANCH}" >/dev/null 2>&1; then
              echo "Private recovery data present: ${FILE}"
            else
              echo "Private recovery file absent (may be normal for a first run): ${FILE}"
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websocket-client

      - name: Show GitHub Runner Public IP
        run: |
          echo "=================================="
          echo "GITHUB RUNNER PUBLIC IPv4 ADDRESS"
          echo "=================================="
          IP=$(curl -4 -sS https://api.ipify.org)
          echo "YOUR IP ADDRESS: $IP"
          echo "=================================="
          echo "COPY THIS IP AND ADD IT TO DELTA"

      - name: Wait for Delta IP Whitelisting
        run: |
          echo "You have 90 seconds to add this IP to Delta."
          sleep 90
          echo "Waiting period completed."
          echo "Starting bot now."

      - name: Run XAUT Bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
          GITHUB_REPOSITORY: mishraarvind463-del/xaut-bot
          RECOVERY_STATE_REPOSITORY: mishraarvind463-del/xaut-bot
          RECOVERY_STATE_BRANCH: "xaut-recovery-state"
          REMOTE_RECOVERY_REQUIRED: "true"
          BOT_WATCHDOG_TIMEOUT_SECONDS: "180"
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          BOT_RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        working-directory: private-bot
        run: python -u bot.py

