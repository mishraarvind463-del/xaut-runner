name: Setup A
run-name: Setup A - ${{ inputs.enable_live_trading && 'LIVE' || 'PAPER' }}

on:
  workflow_dispatch:
    inputs:
      enable_live_trading:
        description: "OFF = Paper Trading | ON = Live Trading"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

# Never run Paper and Live concurrently against the same Delta account.
concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    # Bot runtime is 340 minutes. Remaining time is reserved for setup and checkpointing.
    timeout-minutes: 360

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private bot
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        timeout-minutes: 10
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --retries 5 --timeout 30
          python -m pip install --retries 5 --timeout 30 -r private-bot/requirements.txt
          python -m pip check

      - name: Verify required API secrets
        timeout-minutes: 2
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "${API_KEY:-}" && -n "${API_SECRET:-}" ]] || {
            echo "::error::API_KEY or API_SECRET repository secret is missing."
            exit 1
          }
          echo "Delta API credentials are present; secret values are not displayed."

      - name: Verify Live confirmation secret
        if: ${{ inputs.enable_live_trading }}
        timeout-minutes: 2
        shell: bash
        env:
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
        run: |
          set -euo pipefail
          [[ "$LIVE_TRADING_CONFIRM" == "CONFIRM_XAUTUSD_131253" ]] || {
            echo "::error::Live requested but LIVE_TRADING_CONFIRM secret is missing or incorrect."
            exit 1
          }
          echo "Live confirmation secret verified without printing its value."

      - name: Verify bot mode and strategy configuration
        timeout-minutes: 2
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          BOT_RUNTIME_MINUTES: "340"
        run: |
          set -euo pipefail
          python -m py_compile private-bot/bot.py
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          path = Path("private-bot/bot.py")
          spec = importlib.util.spec_from_file_location("xaut_setup_a_preflight", path)
          if spec is None or spec.loader is None:
              raise SystemExit("Cannot load private-bot/bot.py")
          bot = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bot)
          bot.validate_configuration()
          requested_live = os.environ.get("ENABLE_LIVE_TRADING", "false").lower() == "true"
          if requested_live != (bot.LIVE_TRADING is True):
              raise SystemExit("Selected workflow mode does not match bot Live/Paper mode.")
          if bot.PAPER_MODE == requested_live:
              raise SystemExit("Bot PAPER_MODE and workflow selection disagree.")
          if (bot.SYMBOL, bot.PRODUCT_ID, bot.CANDLE_SYMBOL) != ("XAUTUSD", 131253, "MARK:XAUTUSD"):
              raise SystemExit("Symbol/product/Mark Price candle identity mismatch.")
          if bot.LOT_SIZE != 1 or bot.MAX_LOTS != 1 or bot.CANDLE_CLOSE_DELAY != 3:
              raise SystemExit("Expected 1-lot cap or 3-second candle-close delay changed.")
          if bot.BOT_RUNTIME_MINUTES != 340:
              raise SystemExit("Expected 340-minute runtime was not loaded.")
          print("MODE PREFLIGHT PASSED:", "LIVE" if requested_live else "PAPER")
          print("STRATEGY:", bot.SYMBOL, bot.CANDLE_SYMBOL, "ATR", bot.ATR_PERIOD,
                "MULTIPLIER", bot.MULTIPLIER, "LOT", bot.LOT_SIZE,
                "MAX_LOTS", bot.MAX_LOTS, "CLOSE_DELAY", bot.CANDLE_CLOSE_DELAY)
          PY

      - name: Run offline Paper and Live execution tests
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          find_test() {
            local name="$1"
            find . -type f \( -name "$name" -o -name "${name%.py}.txt" \) \
              -not -path './private-bot/*' -print -quit
          }
          PRELIVE_TEST="$(find_test test_pre_live_suite.py)"
          STOP_TEST="$(find_test test_forced_interruption_simulation.py)"
          [[ -n "$PRELIVE_TEST" ]] || { echo "::error::test_pre_live_suite.py not found in runner repository."; exit 1; }
          [[ -n "$STOP_TEST" ]] || { echo "::error::test_forced_interruption_simulation.py not found in runner repository."; exit 1; }
          python "$PRELIVE_TEST" private-bot/bot.py
          python "$STOP_TEST" private-bot/bot.py
          # Keep the Live mock suite inside Setup A so no third repository file is required.
          LIVE_TEST="$RUNNER_TEMP/test_live_mock_suite.py"
          cat > "$LIVE_TEST" <<'LIVE_TEST_EOF'
          #!/usr/bin/env python3
          """Offline mock tests of XAUTUSD Live execution safeguards. No Delta calls/orders."""
          import importlib.util
          import json
          import os
          import pathlib
          import tempfile
          import sys
          from unittest.mock import patch
          
          BOT_PATH = pathlib.Path(sys.argv[1]).resolve() if len(sys.argv) > 1 else pathlib.Path(__file__).with_name('bot.py').resolve()
          os.environ.update({
              'API_KEY': 'offline-mock-key',
              'API_SECRET': 'offline-mock-secret',
              'ENABLE_LIVE_TRADING': 'true',
              'LIVE_TRADING_CONFIRM': 'CONFIRM_XAUTUSD_131253',
          })
          spec = importlib.util.spec_from_file_location('xaut_live_mock_bot', BOT_PATH)
          bot = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = bot
          spec.loader.exec_module(bot)
          
          bot.API_KEY = 'offline-mock-key'
          bot.API_SECRET = 'offline-mock-secret'
          bot.PAPER_MODE = False
          check_live_config = bot.LIVE_TRADING is True and bot.PAPER_MODE is False
          if not check_live_config:
              raise AssertionError('mock suite did not enter explicit test-only Live configuration')
          
          passed = []
          def check(label, condition):
              if not condition:
                  raise AssertionError(label)
              passed.append(label)
              print('PASS:', label)
          
          class FakeAlerts:
              def notify(self, *args, **kwargs): pass
          
          bot.ALERTS = FakeAlerts()
          bot.alert_incident = lambda *a, **k: None
          bot.alert_recovered = lambda *a, **k: None
          
          with tempfile.TemporaryDirectory(prefix='xaut-live-mock-') as tmp:
              old_cwd = pathlib.Path.cwd()
              os.chdir(tmp)
              try:
                  # 1. Simulated successful live BUY order; intent must be durable before POST.
                  journal = bot.default_execution_journal()
                  order_result = {
                      'id': 8123, 'product_id': bot.PRODUCT_ID, 'client_order_id': None,
                      'side': 'buy', 'size': 1, 'unfilled_size': 0,
                      'order_type': 'market_order', 'reduce_only': False,
                      'state': 'closed', 'average_fill_price': '3800.0'
                  }
                  post_payloads = []
                  persisted_before_post = []
                  def fake_req(method, path, payload=None):
                      if method == 'POST' and path == '/v2/orders':
                          data = json.loads(pathlib.Path(bot.EXECUTION_JOURNAL_FILE).read_text())
                          persisted_before_post.append(data['pending_order']['phase'] == 'prepared_before_post')
                          order_result['client_order_id'] = payload['client_order_id']
                          post_payloads.append(dict(payload))
                          return {'success': True, 'result': dict(order_result)}
                      if method == 'GET' and path == '/v2/orders/8123':
                          return {'success': True, 'result': dict(order_result)}
                      raise AssertionError(f'unexpected request: {method} {path}')
                  positions = iter([0.0, 1.0])
                  with patch.object(bot, 'req', side_effect=fake_req), \
                       patch.object(bot, 'ensure_no_open_orders', return_value=True), \
                       patch.object(bot, 'read_stable_position', side_effect=lambda: next(positions)), \
                       patch.object(bot.time, 'sleep', return_value=None):
                      ok = bot.execute_target_position(journal, 1, False, 'MOCK ENTRY')
                  check('order intent persisted before mocked POST', persisted_before_post == [True])
                  check('successful mock order uses one POST and correct product/lot', ok and len(post_payloads) == 1 and post_payloads[0]['product_id'] == 131253 and post_payloads[0]['size'] == 1)
                  check('filled order reconciles journal to exchange position', journal['managed_position'] == 1 and journal['pending_order'] is None)
          
                  # 2. Ambiguous POST timeout: same client ID lookup only; never replay POST.
                  journal2 = bot.default_execution_journal()
                  post_count = {'n': 0}
                  def ambiguous_req(method, path, payload=None):
                      if method == 'POST':
                          post_count['n'] += 1
                          raise bot.APIError('simulated ambiguous POST timeout', transient=True)
                      raise AssertionError(f'unexpected raw request: {method} {path}')
                  with patch.object(bot, 'req', side_effect=ambiguous_req), \
                       patch.object(bot, 'get_order_by_client_id', return_value=None), \
                       patch.object(bot.time, 'sleep', return_value=None), \
                       patch.object(bot, 'ORDER_CONFIRM_TIMEOUT', 0.02):
                      result = bot.place_market_order(journal2, 'buy', 1, False, 0.0, 'MOCK AMBIGUOUS')
                  saved2 = json.loads(pathlib.Path(bot.EXECUTION_JOURNAL_FILE).read_text())
                  check('ambiguous POST attempted exactly once', post_count['n'] == 1)
                  check('ambiguous POST is not resent and unresolved intent remains durable', result is None and saved2['pending_order']['phase'] == 'post_outcome_unknown')
          
                  # 3. Restart recovery of a known client order ID and confirmed exchange fill.
                  journal3 = bot.default_execution_journal()
                  journal3['pending_order'] = {
                      'client_order_id': 'xautbot-recovery1234567890', 'product_id': 131253,
                      'side': 'buy', 'size': 1, 'reduce_only': False, 'before_position': 0.0,
                      'purpose': 'MOCK_RECOVERY', 'phase': 'post_outcome_unknown', 'exchange_order_id': None
                  }
                  bot.save_execution_journal(journal3)
                  recovered_order = {
                      'id': 9001, 'product_id': 131253,
                      'client_order_id': journal3['pending_order']['client_order_id'],
                      'side': 'buy', 'size': 1, 'unfilled_size': 0,
                      'order_type': 'market_order', 'reduce_only': False,
                      'state': 'closed'
                  }
                  with patch.object(bot, 'get_order_by_client_id', return_value=recovered_order), \
                       patch.object(bot, 'read_stable_position', return_value=1.0):
                      recovered = bot.recover_pending_order(journal3)
                  check('restart recovers original order by client ID without resubmission', recovered and journal3['pending_order'] is None and journal3['managed_position'] == 1)
          
                  # 4. Exchange/local position mismatch must stop before strategy orders.
                  mismatch_journal = bot.default_execution_journal()
                  with patch.object(bot, 'recover_pending_order', return_value=True), \
                       patch.object(bot, 'ensure_no_open_orders', return_value=True), \
                       patch.object(bot, 'read_stable_position', return_value=1.0):
                      blocked = False
                      try:
                          bot.startup_live_reconciliation(mismatch_journal, True)
                      except bot.RecoveryRequired:
                          blocked = True
                  check('startup blocks exchange/local position mismatch', blocked)
          
                  # 5. A failed startup may create a checkpoint only after a fresh flat/no-orders proof.
                  safe_journal = bot.default_execution_journal()
                  with patch.object(bot, 'validate_product_identity', return_value=True), \
                       patch.object(bot, 'read_stable_position', return_value=0.0), \
                       patch.object(bot, 'get_open_orders', return_value=[]):
                      checkpointed = bot.checkpoint_live_startup_if_safe(safe_journal)
                  manifest = json.loads(pathlib.Path(bot.STATE_MANIFEST_FILE).read_text())
                  check('safe Live startup failure checkpoints only verified-flat journal', checkpointed and manifest['mode'] == 'LIVE' and 'execution_journal.json' in manifest['files'])
          
                  # 6. An unresolved order intent must never receive a startup-failure checkpoint.
                  pathlib.Path(bot.STATE_MANIFEST_FILE).unlink()
                  unsafe_journal = bot.default_execution_journal()
                  unsafe_journal['pending_order'] = {'client_order_id': 'pending-mock-order'}
                  refused = bot.checkpoint_live_startup_if_safe(unsafe_journal)
                  check('unresolved Live order intent blocks startup-failure checkpoint', not refused and not pathlib.Path(bot.STATE_MANIFEST_FILE).exists())
              finally:
                  os.chdir(old_cwd)
          
          print(f'LIVE MOCK EXECUTION SAFETY SUITE: ALL {len(passed)} CHECKS PASSED (offline; no Delta API calls; no real orders).')
          LIVE_TEST_EOF
          python "$LIVE_TEST" private-bot/bot.py

      - name: Record source revisions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          BOT_SHA="$(git -C private-bot rev-parse HEAD)"
          echo "BOT_COMMIT_SHA=${BOT_SHA}" >> "$GITHUB_ENV"
          {
            echo "### XAUTUSD source revisions"
            echo "Runner commit: \`${GITHUB_SHA}\`"
            echo "Private bot commit: \`${BOT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect runner public IP
        id: runner_ip
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          IP=""
          for attempt in 1 2 3 4 5; do
            if IP="$(curl -4 -fsS --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors --retry-delay 2 https://api.ipify.org)" \
              && [[ "$IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
              break
            fi
            IP=""
            sleep 3
          done
          [[ -n "$IP" ]] || { echo "::error::Could not detect runner public IPv4."; exit 1; }
          echo "Runner public IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Add this temporary IP to the Delta API key whitelist: $IP" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Delta IP whitelist
        timeout-minutes: 3
        run: |
          echo "Add the runner public IP displayed above to Delta API Management."
          echo "Waiting 90 seconds before authenticated API checks."
          sleep 90

      - name: Clear workspace runtime files before restoring selected mode
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          names = [
              "paper_state.json", "execution_journal.json", "alert_state.json",
              "trade_history.csv", "trade_history_legacy.csv", "state_manifest.json",
              "paper_state.json.tmp", "execution_journal.json.tmp", "alert_state.json.tmp",
              "trade_history.csv.tmp", "trade_history_legacy.csv.tmp", "state_manifest.json.tmp",
          ]
          for name in names:
              path = Path(name)
              if path.is_symlink() or path.is_file():
                  path.unlink()
              elif path.exists():
                  raise SystemExit(f"Unexpected directory at runtime-state path: {name}")
          print("Workspace runtime files cleared; only the selected mode's checkpoint will be restored.")
          PY

      - name: Restore and verify selected mode state
        id: restore_state
        timeout-minutes: 18
        env:
          GH_TOKEN: ${{ github.token }}
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          BOT_RUNTIME_MINUTES: "340"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path

          mode = "LIVE" if os.environ.get("ENABLE_LIVE_TRADING", "false").lower() == "true" else "PAPER"
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          current_run_id = os.environ["GITHUB_RUN_ID"]
          current_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          temp_root = Path(os.environ["RUNNER_TEMP"])
          sys.path.insert(0, str((workspace / "private-bot").resolve()))
          import bot

          bot.validate_configuration()
          if mode == "LIVE" and (bot.LIVE_TRADING is not True or bot.PAPER_MODE is not False):
              raise SystemExit("LIVE restore stopped: bot did not enter the explicitly selected Live mode.")
          if mode == "PAPER" and (bot.PAPER_MODE is not True or bot.LIVE_TRADING is not False):
              raise SystemExit("PAPER restore stopped: bot mode is inconsistent.")

          def gh_json(args):
              last = None
              for attempt in range(1, 6):
                  try:
                      raw = subprocess.check_output(["gh", *args], text=True, stderr=subprocess.STDOUT)
                      return json.loads(raw)
                  except Exception as error:
                      last = error
                      if attempt < 5:
                          time.sleep(attempt * 2)
              raise SystemExit(f"GitHub state lookup failed after retries: {last!r}")

          def get_artifacts(run_id):
              payload = gh_json(["api", f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"])
              return {a.get("name") for a in payload.get("artifacts", []) if not a.get("expired", False)}

          def attempts_for(names, regex):
              pattern = re.compile(regex)
              values = []
              for name in names:
                  match = pattern.fullmatch(name or "")
                  if match:
                      values.append(int(match.group(1)))
              return sorted(set(values), reverse=True)

          def download_artifact(run_id, artifact_name, destination):
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              last = None
              for retry in range(1, 5):
                  try:
                      subprocess.check_call([
                          "gh", "run", "download", str(run_id), "--repo", repo,
                          "--name", artifact_name, "--dir", str(destination)
                      ])
                      return
                  except Exception as error:
                      last = error
                      if retry < 4:
                          time.sleep(retry * 3)
              raise SystemExit(f"Could not download {artifact_name} from run {run_id}: {last!r}")

          def read_json(path):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Checkpoint file is missing or not regular: {path}")
              try:
                  obj = json.loads(path.read_text(encoding="utf-8"))
              except Exception as error:
                  raise SystemExit(f"Invalid JSON in {path.name}: {error!r}")
              if not isinstance(obj, dict):
                  raise SystemExit(f"Invalid JSON object in {path.name}")
              return obj

          def validate_and_restore(run_id, attempt, run_record, state_name, marker_name):
              state_dir = temp_root / f"xaut-{mode.lower()}-state-{run_id}-{attempt}"
              marker_dir = temp_root / f"xaut-{mode.lower()}-marker-{run_id}-{attempt}"
              download_artifact(run_id, state_name, state_dir)
              download_artifact(run_id, marker_name, marker_dir)
              manifest_path = state_dir / "state_manifest.json"
              manifest = read_json(manifest_path)
              if manifest.get("schema_version") != 1 or manifest.get("mode") != mode:
                  raise SystemExit(f"{mode} checkpoint manifest mode/schema mismatch.")
              if manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
                  raise SystemExit("Checkpoint manifest symbol/product mismatch.")
              meta = manifest.get("run")
              if not isinstance(meta, dict):
                  raise SystemExit("Checkpoint manifest run metadata is missing.")
              if (str(meta.get("workflow_run_id", "")) != str(run_id)
                      or str(meta.get("workflow_run_attempt", "")) != str(attempt)
                      or meta.get("repository") != repo or meta.get("ref_name") != branch):
                  raise SystemExit("Checkpoint manifest does not match its source workflow run/attempt/branch.")
              expected_commit = run_record.get("head_sha")
              if expected_commit and meta.get("runner_commit_sha") != expected_commit:
                  raise SystemExit("Checkpoint manifest runner commit does not match source workflow commit.")

              marker = read_json(marker_dir / "xaut-run-started.json")
              marker_mode = marker.get("mode")
              # Legacy Paper checkpoints predate the explicit marker mode field;
              # their xaut-run-started artifact is unambiguously Paper-only.
              # New Live checkpoints must always carry an explicit LIVE marker.
              marker_mode_valid = (
                  marker_mode == mode if mode == "LIVE" else marker_mode in (None, "PAPER")
              )
              if (not marker_mode_valid
                      or str(marker.get("workflow_run_id", "")) != str(run_id)
                      or str(marker.get("workflow_run_attempt", "")) != str(attempt)
                      or marker.get("repository") != repo or marker.get("branch") != branch
                      or marker.get("workflow_commit") != expected_commit
                      or marker.get("bot_commit") != meta.get("bot_commit_sha")):
                  raise SystemExit("Run-start marker does not match the checkpoint source metadata.")

              required = "execution_journal.json" if mode == "LIVE" else "paper_state.json"
              forbidden = "paper_state.json" if mode == "LIVE" else "execution_journal.json"
              allowed = {required, "alert_state.json", "trade_history.csv", "trade_history_legacy.csv"}
              # Older Paper checkpoints could carry a dormant Live journal.
              # Permit it only after proving it is flat and has no pending order;
              # it is verified but deliberately not restored into Paper mode.
              if mode == "PAPER":
                  allowed.add(forbidden)
              records = manifest.get("files")
              if (not isinstance(records, dict) or required not in records
                      or (mode == "LIVE" and forbidden in records)):
                  raise SystemExit(f"{mode} checkpoint required/forbidden state file mismatch.")
              names = set(records)
              if not names.issubset(allowed):
                  raise SystemExit(f"Checkpoint contains unexpected files: {sorted(names - allowed)}")
              actual = {p.name for p in state_dir.iterdir() if p.is_file()}
              if actual != names | {"state_manifest.json"}:
                  raise SystemExit("Downloaded checkpoint file set does not exactly match its manifest.")
              for path in state_dir.iterdir():
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit("Checkpoint contains a symlink or non-file entry.")
              for name, record in records.items():
                  file_path = state_dir / name
                  if not isinstance(record, dict):
                      raise SystemExit(f"Malformed checksum record: {name}")
                  if (hashlib.sha256(file_path.read_bytes()).hexdigest() != record.get("sha256")
                          or file_path.stat().st_size != int(record.get("size_bytes", -1))):
                      raise SystemExit(f"Checkpoint checksum/size mismatch: {name}")
                  if (state_dir / (name + ".tmp")).exists():
                      raise SystemExit(f"Unfinished checkpoint temporary file: {name}.tmp")

              if mode == "LIVE":
                  journal = read_json(state_dir / "execution_journal.json")
                  if (journal.get("version") != 1 or journal.get("symbol") != "XAUTUSD"
                          or int(journal.get("product_id", -1)) != 131253):
                      raise SystemExit("Live execution journal identity/version mismatch.")
                  managed = float(journal.get("managed_position", 999))
                  if not (managed == 0.0 and journal.get("pending_order") is None):
                      raise SystemExit("Live checkpoint is not flat and free of unresolved order intents.")
              else:
                  paper = read_json(state_dir / "paper_state.json")
                  if (paper.get("version") not in (1, 2) or paper.get("symbol") != "XAUTUSD"
                          or int(paper.get("product_id", -1)) != 131253
                          or not isinstance(paper.get("state"), dict)):
                      raise SystemExit("Paper state identity/version/body mismatch.")
                  position = float(paper["state"].get("position"))
                  if position not in (-1.0, 0.0, 1.0) or paper["state"].get("pending_csv_trade") is not None:
                      raise SystemExit("Paper checkpoint has invalid position or unresolved CSV transaction.")
                  if forbidden in records:
                      legacy_journal = read_json(state_dir / forbidden)
                      if (legacy_journal.get("version") != 1
                              or legacy_journal.get("symbol") != "XAUTUSD"
                              or int(legacy_journal.get("product_id", -1)) != 131253
                              or float(legacy_journal.get("managed_position", 999)) != 0.0
                              or legacy_journal.get("pending_order") is not None):
                          raise SystemExit("Legacy Paper checkpoint contains a non-flat or unresolved Live journal.")

              for name in names:
                  if mode == "PAPER" and name == forbidden:
                      print("Verified dormant legacy Live journal is flat; excluding it from Paper restore.")
                      continue
                  shutil.copy2(state_dir / name, workspace / name)
              print(f"RESTORED VERIFIED {mode} CHECKPOINT: run={run_id}, attempt={attempt}.")

          # Include earlier attempts of this same workflow_dispatch when a run is re-run.
          sources = []
          current_artifacts = get_artifacts(current_run_id)
          marker_prefix = "xaut-live-run-started-a" if mode == "LIVE" else "xaut-run-started-a"
          state_prefix = "xaut-live-state-a" if mode == "LIVE" else "xaut-paper-state-a"
          marker_rx = re.escape(marker_prefix) + r"([0-9]+)"
          state_rx = re.escape(state_prefix) + r"([0-9]+)"
          for attempt in range(current_attempt - 1, 0, -1):
              marker_name = f"{marker_prefix}{attempt}"
              state_name = f"{state_prefix}{attempt}"
              if marker_name in current_artifacts or state_name in current_artifacts:
                  sources.append((current_run_id, attempt, None, current_artifacts))
                  break

          workflow_runs = gh_json([
              "api", "--paginate", "--slurp",
              "-f", f"branch={branch}", "-f", "event=workflow_dispatch",
              "-F", "per_page=100",
              f"repos/{repo}/actions/workflows/setup-a.yml/runs",
          ])
          previous = []
          for page in workflow_runs if isinstance(workflow_runs, list) else [workflow_runs]:
              if isinstance(page, dict):
                  previous.extend(page.get("workflow_runs", []) or [])
          previous = [r for r in previous if str(r.get("id")) != current_run_id
                      and r.get("head_branch") == branch and r.get("event") == "workflow_dispatch"]
          previous.sort(key=lambda r: (r.get("created_at", ""), int(r.get("id", 0))), reverse=True)
          previous_with_artifacts = []
          for run in previous:
              artifacts = get_artifacts(run["id"])
              previous_with_artifacts.append((run, artifacts))
              sources.append((str(run["id"]), int(run.get("run_attempt", 1)), run, artifacts))

          # A Paper run must not silently ignore an earlier unfinished Live run.
          # A matching Live marker + verified Live checkpoint proves that the previous
          # Live shutdown confirmed a flat exchange position and no active XAUTUSD orders.
          if mode == "PAPER":
              live_marker_rx = re.escape("xaut-live-run-started-a") + r"([0-9]+)"
              live_state_rx = re.escape("xaut-live-state-a") + r"([0-9]+)"
              for live_run, artifacts in previous_with_artifacts:
                  marker_attempts = attempts_for(artifacts, live_marker_rx)
                  state_attempts = attempts_for(artifacts, live_state_rx)
                  evidence = sorted(set(marker_attempts) | set(state_attempts), reverse=True)
                  if not evidence:
                      continue
                  latest_attempt = evidence[0]
                  marker_name = f"xaut-live-run-started-a{latest_attempt}"
                  state_name = f"xaut-live-state-a{latest_attempt}"
                  if marker_name not in artifacts or state_name not in artifacts:
                      raise SystemExit(
                          f"PAPER START STOP: most recent Live run {live_run['id']} attempt {latest_attempt} "
                          "has no matching verified flat-state checkpoint. Inspect Delta XAUTUSD position "
                          "and open orders before switching modes."
                      )
                  break

          restored = False
          for run_id, latest_attempt, run_record, artifact_names in sources:
              # Find the newest attempt in this run that has evidence for the selected mode.
              marker_attempts = attempts_for(artifact_names, marker_rx)
              state_attempts = attempts_for(artifact_names, state_rx)
              evidence = sorted(set(marker_attempts) | set(state_attempts), reverse=True)
              if not evidence:
                  continue
              attempt = evidence[0]
              marker_name = f"{marker_prefix}{attempt}"
              state_name = f"{state_prefix}{attempt}"
              has_marker = marker_name in artifact_names
              has_state = state_name in artifact_names
              if not has_marker or not has_state:
                  if mode == "LIVE":
                      raise SystemExit(
                          f"LIVE RESTORE STOP: run {run_id} attempt {attempt} started Live bot but has no matching verified checkpoint. "
                          "Inspect Delta XAUTUSD position and open orders before any further Live run; do not reset the journal automatically."
                      )
                  raise SystemExit(
                      f"PAPER RESTORE STOP: run {run_id} attempt {attempt} started Paper bot but has no matching verified checkpoint. "
                      "Refusing to roll back behind an interrupted run; inspect the latest Paper state before retrying."
                  )
              if run_record is None:
                  attempt_meta = gh_json(["api", f"repos/{repo}/actions/runs/{run_id}/attempts/{attempt}"])
                  run_record = {
                      "id": run_id,
                      "head_sha": attempt_meta.get("head_sha"),
                  }
              validate_and_restore(run_id, attempt, run_record, state_name, marker_name)
              restored = True
              break

          if not restored:
              if mode == "LIVE":
                  # A first Live start is allowed only after the exchange itself proves flat/no-orders.
                  bot.validate_product_identity()
                  position = bot.read_stable_position()
                  orders = bot.get_open_orders()
                  if position is None or not bot.positions_equal(position, 0):
                      raise SystemExit(f"FIRST LIVE START STOP: Delta XAUTUSD position is not verified flat ({position}).")
                  if orders is None or orders:
                      raise SystemExit("FIRST LIVE START STOP: Delta XAUTUSD open-order list is not verified empty.")
                  bot.save_execution_journal(bot.default_execution_journal())
                  print("FIRST LIVE INITIALIZATION: flat exchange verified; fresh execution journal created.")
              else:
                  print("No previous Paper run checkpoint found; bot will initialize a new flat Paper state.")

          if mode == "LIVE":
              journal, exists = bot.load_execution_journal()
              if not exists:
                  raise SystemExit("LIVE RESTORE STOP: execution journal was not persisted.")
              if float(journal.get("managed_position", 999)) != 0.0 or journal.get("pending_order") is not None:
                  raise SystemExit("LIVE RESTORE STOP: journal must be flat and have no unresolved order.")
              bot.validate_product_identity()
              position = bot.read_stable_position()
              orders = bot.get_open_orders()
              if position is None or not bot.positions_equal(position, 0):
                  raise SystemExit(f"LIVE PRE-START STOP: exchange position is not verified flat ({position}).")
              if orders is None or orders:
                  raise SystemExit("LIVE PRE-START STOP: open XAUTUSD orders are not verified empty.")
              if not bot.positions_equal(position, journal.get("managed_position", 999)):
                  raise SystemExit("LIVE PRE-START STOP: exchange position and restored journal disagree.")
              print("LIVE RESTORE PASSED: journal flat; exchange flat; no open XAUTUSD orders.")
          else:
              # The bot itself validates Paper state again before it starts its strategy loop.
              if Path("execution_journal.json").exists():
                  raise SystemExit("PAPER RESTORE STOP: a Live execution journal was restored into Paper mode.")
              if Path("paper_state.json").exists():
                  bot.load_paper_state()
              print("PAPER RESTORE PASSED: Paper state is isolated from Live journal.")
          PY

      - name: Invalidate previous checkpoint manifest
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          rm -f state_manifest.json state_manifest.json.tmp

      - name: Prepare bot-start marker
        id: prepare_marker
        timeout-minutes: 2
        env:
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          BOT_COMMIT_SHA: ${{ env.BOT_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          mode = "LIVE" if os.environ.get("ENABLE_LIVE_TRADING", "false").lower() == "true" else "PAPER"
          payload = {
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "bot_commit": os.environ.get("BOT_COMMIT_SHA", ""),
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "mode": mode,
              "symbol": "XAUTUSD",
              "product_id": 131253,
          }
          target = os.path.join(os.environ["RUNNER_TEMP"], "xaut-run-started.json")
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, separators=(",", ":"))
          print("Run-start marker prepared; no API credentials are stored.")
          PY

      - name: Upload bot-start marker
        id: upload_run_marker
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.enable_live_trading && 'xaut-live-run-started-a' || 'xaut-run-started-a' }}${{ github.run_attempt }}
          path: ${{ runner.temp }}/xaut-run-started.json
          if-no-files-found: error
          retention-days: 30

      - name: Run XAUT Bot
        id: run_bot
        if: steps.upload_run_marker.outcome == 'success'
        timeout-minutes: 350
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          BOT_RUNTIME_MINUTES: "340"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM || secrets.SMTP_USER }}
        run: python -u private-bot/bot.py

      - name: Validate and prepare selected mode checkpoint
        id: checkpoint
        if: always() && steps.upload_run_marker.outcome == 'success'
        timeout-minutes: 8
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          BOT_RUNTIME_MINUTES: "340"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import importlib.util
          import json
          import math
          import os
          import shutil
          import sys
          from pathlib import Path

          mode = "LIVE" if os.environ.get("ENABLE_LIVE_TRADING", "false").lower() == "true" else "PAPER"
          required = "execution_journal.json" if mode == "LIVE" else "paper_state.json"
          forbidden = "paper_state.json" if mode == "LIVE" else "execution_journal.json"
          allowed = {required, "alert_state.json", "trade_history.csv", "trade_history_legacy.csv"}

          def fail(message):
              raise SystemExit(f"{mode} CHECKPOINT REJECTED: {message}")

          manifest_path = Path("state_manifest.json")
          if manifest_path.is_symlink() or not manifest_path.is_file():
              fail("bot did not create a new checkpoint manifest; no artifact will be uploaded")
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception as error:
              fail(f"manifest JSON is invalid: {error!r}")
          if not isinstance(manifest, dict) or manifest.get("schema_version") != 1:
              fail("manifest schema is invalid")
          if manifest.get("mode") != mode or manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
              fail("manifest mode/symbol/product mismatch")
          run_meta = manifest.get("run")
          if (not isinstance(run_meta, dict)
                  or str(run_meta.get("workflow_run_id", "")) != os.environ.get("GITHUB_RUN_ID", "")
                  or str(run_meta.get("workflow_run_attempt", "")) != os.environ.get("GITHUB_RUN_ATTEMPT", "")
                  or run_meta.get("repository") != os.environ.get("GITHUB_REPOSITORY", "")
                  or run_meta.get("ref_name") != os.environ.get("GITHUB_REF_NAME", "")):
              fail("manifest run/attempt/repository/branch metadata mismatch")

          records = manifest.get("files")
          if not isinstance(records, dict) or required not in records or forbidden in records:
              fail("required selected-mode state file is missing or other-mode state is present")
          names = set(records)
          if not names.issubset(allowed):
              fail(f"unexpected checkpoint file names: {sorted(names - allowed)}")
          for name in list(allowed) + ["state_manifest.json"]:
              if Path(name + ".tmp").exists():
                  fail(f"unfinished atomic-write temp file exists: {name}.tmp")
          for name, record in records.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file() or not isinstance(record, dict):
                  fail(f"checkpoint file is missing or invalid: {name}")
              if (hashlib.sha256(path.read_bytes()).hexdigest() != record.get("sha256")
                      or path.stat().st_size != int(record.get("size_bytes", -1))):
                  fail(f"checkpoint checksum/size mismatch: {name}")

          if mode == "PAPER":
              paper = json.loads(Path("paper_state.json").read_text(encoding="utf-8"))
              if (paper.get("version") not in (1, 2) or paper.get("symbol") != "XAUTUSD"
                      or int(paper.get("product_id", -1)) != 131253 or not isinstance(paper.get("state"), dict)):
                  fail("Paper state identity/version/body is invalid")
              position = float(paper["state"].get("position"))
              if not math.isfinite(position) or position not in (-1.0, 0.0, 1.0):
                  fail("Paper position is invalid")
              if paper["state"].get("pending_csv_trade") is not None:
                  fail("Paper CSV transaction remains unresolved")
          else:
              journal = json.loads(Path("execution_journal.json").read_text(encoding="utf-8"))
              if (journal.get("version") != 1 or journal.get("symbol") != "XAUTUSD"
                      or int(journal.get("product_id", -1)) != 131253):
                  fail("Live execution journal identity/version is invalid")
              managed = float(journal.get("managed_position", 999))
              if managed != 0.0 or journal.get("pending_order") is not None:
                  fail("Live shutdown did not leave a flat, resolved execution journal")
              sys.path.insert(0, str(Path("private-bot").resolve()))
              import bot
              bot.validate_configuration()
              bot.validate_product_identity()
              exchange_position = bot.read_stable_position()
              open_orders = bot.get_open_orders()
              if exchange_position is None or not bot.positions_equal(exchange_position, 0):
                  fail(f"Delta XAUTUSD position is not verified flat after shutdown: {exchange_position}")
              if open_orders is None or open_orders:
                  fail("Delta XAUTUSD active-order list is not verified empty after shutdown")

          if "alert_state.json" in records:
              alert = json.loads(Path("alert_state.json").read_text(encoding="utf-8"))
              if (alert.get("version") != 1 or not isinstance(alert.get("active_incidents"), dict)
                      or not isinstance(alert.get("queue"), list)):
                  fail("alert state is invalid")
          if "trade_history.csv" in records:
              with open("trade_history.csv", "r", newline="", encoding="utf-8") as handle:
                  reader = csv.DictReader(handle)
                  if reader.fieldnames != [
                      "symbol", "mode", "direction", "quantity", "entry_time_utc",
                      "exit_time_utc", "entry_price", "exit_price", "price_points",
                      "cumulative_points", "exit_reason",
                  ]:
                      fail("trade-history CSV header mismatch")
                  for _ in reader:
                      pass
          if "trade_history_legacy.csv" in records:
              with open("trade_history_legacy.csv", "r", newline="", encoding="utf-8-sig") as handle:
                  reader = csv.reader(handle)
                  if not next(reader, None):
                      fail("legacy trade-history CSV has no header")
                  for _ in reader:
                      pass

          out = Path("state-artifact")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()
          for name in sorted(names):
              shutil.copy2(name, out / name)
          shutil.copy2(manifest_path, out / "state_manifest.json")
          print(f"VERIFIED {mode} CHECKPOINT READY: {', '.join(sorted(names))}")
          PY

      - name: Upload verified selected-mode state
        id: upload_checkpoint
        if: steps.checkpoint.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.enable_live_trading && 'xaut-live-state-a' || 'xaut-paper-state-a' }}${{ github.run_attempt }}
          path: state-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded checkpoint is visible
        if: steps.upload_checkpoint.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload_checkpoint.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.enable_live_trading && 'xaut-live-state-a' || 'xaut-paper-state-a' }}${{ github.run_attempt }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.upload_checkpoint.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED="false"
          for attempt in 1 2 3 4 5; do
            if ARTIFACTS_JSON="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" 2>/dev/null)"; then
              if printf '%s' "$ARTIFACTS_JSON" | jq -e \
                --arg id "$EXPECTED_ARTIFACT_ID" \
                --arg name "$EXPECTED_ARTIFACT_NAME" \
                'any(.artifacts[]?; (.id | tostring) == $id and .name == $name and .expired == false)' >/dev/null; then
                VERIFIED="true"
                break
              fi
            fi
            sleep $((attempt * 2))
          done
          [[ "$VERIFIED" == "true" ]] || { echo "::error::Uploaded state artifact could not be verified."; exit 1; }
          {
            echo "### ${{ inputs.enable_live_trading && 'LIVE' || 'PAPER' }} checkpoint verified"
            echo "Artifact: \`${EXPECTED_ARTIFACT_NAME}\`"
            echo "Artifact ID: \`${EXPECTED_ARTIFACT_ID}\`"
            echo "Artifact digest: \`${EXPECTED_ARTIFACT_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verified uploaded checkpoint: $EXPECTED_ARTIFACT_NAME"
