name: Setup A
run-name: Setup A - Paper State v2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      API_KEY: ${{ secrets.API_KEY }}
      API_SECRET: ${{ secrets.API_SECRET }}
      ENABLE_LIVE_TRADING: "false"
      BOT_RUNTIME_MINUTES: "10"

    steps:
      - name: Checkout private bot
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Restore previous Paper state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUNS_JSON="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100")"

          PREVIOUS_RUN_ID="$(printf '%s' "$RUNS_JSON" | jq -r \
            --arg current "$GITHUB_RUN_ID" '
              [
                .workflow_runs[]
                | select(
                    (.path | split("@")[0])
                    == ".github/workflows/setup-a.yml"
                  )
                | select((.id | tostring) != $current)
                | select(.status == "completed")
              ]
              | if length > 0 then .[0].id else "" end
            ')"

          if [[ -z "$PREVIOUS_RUN_ID" ]]; then
            echo "No previous completed Setup A run."
            echo "Starting first Paper state."
            exit 0
          fi

          PREVIOUS_RUN_TITLE="$(printf '%s' "$RUNS_JSON" | jq -r \
            --arg id "$PREVIOUS_RUN_ID" '
              .workflow_runs[]
              | select((.id | tostring) == $id)
              | (.display_title // .name // "")
            ')"

          ARTIFACTS_JSON="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_RUN_ID}/artifacts?per_page=100")"

          if printf '%s' "$ARTIFACTS_JSON" | jq -e '
            any(.artifacts[]?;
              .name == "xaut-paper-state" and .expired == false
            )
          ' >/dev/null; then

            echo "Restoring Paper state from completed run ${PREVIOUS_RUN_ID}"

            gh run download "$PREVIOUS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name xaut-paper-state \
              --dir "$GITHUB_WORKSPACE"

            if [[ ! -s paper_state.json ]]; then
              echo "::error::Paper state artifact is missing paper_state.json."
              exit 1
            fi

            echo "Paper state restored."

          elif [[ "$PREVIOUS_RUN_TITLE" == *"Paper State v2"* ]]; then

            echo "::error::Previous Paper State v2 run has no usable state artifact."
            echo "::error::Refusing to start with a reset state."
            exit 1

          elif printf '%s' "$ARTIFACTS_JSON" | jq -e '
            any(.artifacts[]?;
              .name == "xaut-paper-trade-history" and .expired == false
            )
          ' >/dev/null; then

            echo "Legacy workflow detected. Preserving CSV history."

            mkdir -p "$RUNNER_TEMP/legacy-paper-history"

            gh run download "$PREVIOUS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name xaut-paper-trade-history \
              --dir "$RUNNER_TEMP/legacy-paper-history"

            if [[ ! -s "$RUNNER_TEMP/legacy-paper-history/trade_history.csv" ]]; then
              echo "::error::Legacy CSV file is missing."
              exit 1
            fi

            mv "$RUNNER_TEMP/legacy-paper-history/trade_history.csv" \
              trade_history_legacy.csv

            echo "Legacy CSV preserved separately."

          else
            echo "No previous state artifact found."
            echo "Starting a new flat Paper state."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r private-bot/requirements.txt

      - name: Detect Runner Public IP
        run: |
          set -euo pipefail
          IP=$(curl -4 -sS https://api.ipify.org)
          echo "================================="
          echo "GITHUB RUNNER PUBLIC IP:"
          echo "$IP"
          echo "================================="

      - name: Wait 90 Seconds for Delta IP Whitelist
        run: |
          echo "You have 90 seconds to add the displayed IP to Delta Exchange API whitelist."
          sleep 90
          echo "90 seconds completed. Starting bot."

      - name: Run bot in Paper Mode
        run: python -u private-bot/bot.py

      - name: Save Paper State for Next Run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-paper-state
          path: |
            paper_state.json
            alert_state.json
            trade_history.csv
            trade_history_legacy.csv
          if-no-files-found: warn
          retention-days: 30
