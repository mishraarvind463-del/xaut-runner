name: Setup A

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      API_KEY: ${{ secrets.API_KEY }}
      API_SECRET: ${{ secrets.API_SECRET }}
      ENABLE_LIVE_TRADING: "false"
      BOT_RUNTIME_MINUTES: "30"

    steps:
      - name: Checkout private bot
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r private-bot/requirements.txt

      - name: Detect Runner Public IP
        run: |
          IP=$(curl -4 -sS https://api.ipify.org)
          echo "================================="
          echo "GITHUB RUNNER PUBLIC IP:"
          echo "$IP"
          echo "================================="

      - name: Wait 90 Seconds for Delta IP Whitelist
        run: |
          echo "You have 90 seconds to add the displayed IP to Delta Exchange API whitelist."
          sleep 90
          echo "90 seconds completed. Starting bot."

      - name: Run bot in Paper Mode
        run: python -u private-bot/bot.py

      - name: Save Paper Trade History
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-paper-trade-history
          path: trade_history.csv
          if-no-files-found: warn
          retention-days: 30
