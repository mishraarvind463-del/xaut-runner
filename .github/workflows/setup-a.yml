name: Run XAUT Bot

on:
  workflow_dispatch:
    inputs:
      enable_live_trading:
        description: "Enable REAL trading (use demo first)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Show GitHub Runner Public IP
        run: |
          echo "=================================="
          echo "GITHUB RUNNER PUBLIC IPv4 ADDRESS"
          echo "=================================="
          IP=$(curl -4 -sS https://api.ipify.org)
          echo "YOUR IP ADDRESS: $IP"
          echo "=================================="
          echo "COPY THIS IP AND ADD IT TO DELTA"

      - name: Wait for Delta IP Whitelisting
        run: |
          echo "You have 90 seconds to add this IP to Delta."
          sleep 90
          echo "Waiting period completed."
          echo "Starting bot now."

      - name: Run XAUT Bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          BOT_RUNTIME_MINUTES: "340"
        run: python -u bot.py
