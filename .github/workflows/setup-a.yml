name: Run XAUT Bot

on:
  workflow_dispatch:
    inputs:
      enable_live_trading:
        description: "Enable REAL trading (use demo first)"
        required: true
        type: boolean
        default: false
      runtime_minutes:
        description: "Bot runtime in minutes (use 5 for a short test; default is 350)"
        required: true
        type: choice
        options:
          - "5"
          - "10"
          - "30"
          - "60"
          - "120"
          - "350"
        default: "350"

permissions:
  contents: write
  actions: read

concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private bot
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Verify and initialize durable recovery branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is not set}"
          BRANCH="xaut-recovery-state"
          echo "Checking GitHub token access to ${REPO}."
          gh api "repos/${REPO}" --jq '{full_name: .full_name, default_branch: .default_branch}'

          if gh api "repos/${REPO}/branches/${BRANCH}" >/dev/null 2>&1; then
            echo "Recovery branch already exists: ${BRANCH}"
          else
            echo "Recovery branch does not exist; creating it from the repository default branch."
            DEFAULT_BRANCH="$(gh api "repos/${REPO}" --jq '.default_branch')"
            if [ -z "${DEFAULT_BRANCH}" ] || [ "${DEFAULT_BRANCH}" = "null" ]; then
              echo "ERROR: GitHub did not return a default branch for ${REPO}."
              exit 1
            fi
            BASE_SHA="$(gh api "repos/${REPO}/branches/${DEFAULT_BRANCH}" --jq '.commit.sha')"
            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "null" ]; then
              echo "ERROR: Could not read the HEAD commit of default branch ${DEFAULT_BRANCH}."
              exit 1
            fi

            if ! gh api --method POST "repos/${REPO}/git/refs" \
              -f "ref=refs/heads/${BRANCH}" \
              -f "sha=${BASE_SHA}" >/dev/null; then
              echo "Branch creation request did not succeed; checking whether another run created it concurrently."
            fi

            gh api "repos/${REPO}/branches/${BRANCH}" --jq '{name: .name, commit: .commit.sha}'
            echo "Recovery branch verified: ${BRANCH}"
          fi

      - name: Restore latest recovery checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Searching recent completed runs for the newest available recovery checkpoint."
          RUN_IDS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Run XAUT Bot" \
            --json databaseId,status \
            --limit 100 \
            --jq '.[] | select(.status == "completed") | .databaseId')
          RESTORED=false
          while IFS= read -r PREVIOUS_RUN_ID; do
            [ -n "$PREVIOUS_RUN_ID" ] || continue
            CANDIDATE_DIR=$(mktemp -d)
            echo "Checking recovery artifact from run $PREVIOUS_RUN_ID."
            gh run download "$PREVIOUS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "xaut-recovery-state-$PREVIOUS_RUN_ID" \
              --dir "$CANDIDATE_DIR"
            DOWNLOAD_STATUS=$?
            if [ "$DOWNLOAD_STATUS" -eq 0 ] && [ -s "$CANDIDATE_DIR/bot_recovery_state.json" ]; then
              cp "$CANDIDATE_DIR/bot_recovery_state.json" private-bot/bot_recovery_state.json
              echo "Recovery checkpoint restored from run $PREVIOUS_RUN_ID."
              RESTORED=true
              rm -rf "$CANDIDATE_DIR"
              break
            fi
            rm -rf "$CANDIDATE_DIR"
          done <<< "$RUN_IDS"
          if [ "$RESTORED" != "true" ]; then
            echo "No recovery checkpoint found in the last 100 completed runs; bot will initialize a checkpoint after validating exchange state."
          fi

      - name: Restore latest trade history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Searching recent completed runs for the latest trade-history artifact."
          RUN_IDS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Run XAUT Bot" \
            --json databaseId,status \
            --limit 100 \
            --jq '.[] | select(.status == "completed") | .databaseId')
          RESTORED=false
          while IFS= read -r PREVIOUS_RUN_ID; do
            [ -n "$PREVIOUS_RUN_ID" ] || continue
            CANDIDATE_DIR=$(mktemp -d)
            echo "Checking trade-history artifact from run $PREVIOUS_RUN_ID."
            gh run download "$PREVIOUS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "xaut-trade-history-$PREVIOUS_RUN_ID" \
              --dir "$CANDIDATE_DIR"
            DOWNLOAD_STATUS=$?
            if [ "$DOWNLOAD_STATUS" -eq 0 ] && [ -s "$CANDIDATE_DIR/trade_history.csv" ]; then
              cp "$CANDIDATE_DIR/trade_history.csv" private-bot/trade_history.csv
              echo "Trade history restored from run $PREVIOUS_RUN_ID."
              RESTORED=true
              rm -rf "$CANDIDATE_DIR"
              break
            fi
            rm -rf "$CANDIDATE_DIR"
          done <<< "$RUN_IDS"
          if [ "$RESTORED" != "true" ]; then
            echo "No previous trade-history artifact found in the last 100 completed runs; a new history file will be created after the first completed trade."
          fi

      - name: Restore latest AI shadow memory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          CURRENT_FILE="private-bot/ai_memory.json"
          CURRENT_UPDATED_AT=""
          if [ -s "$CURRENT_FILE" ] && jq -e '
            type == "object" and
            (.schema_version == 1 or .schema_version == 2) and
            .symbol == "XAUTUSD" and
            (.model | type == "object") and
            (.model.weights | type == "object") and
            (.model.samples | type == "number") and
            (.evaluations | type == "array") and
            (.outcomes | type == "array")
          ' "$CURRENT_FILE" >/dev/null 2>&1; then
            CURRENT_UPDATED_AT="$(jq -r '.updated_at_utc // .created_at_utc // empty' "$CURRENT_FILE")"
            echo "Committed AI memory is valid; timestamp: ${CURRENT_UPDATED_AT:-unknown}."
          else
            echo "No valid committed AI memory found; a valid prior artifact may be restored."
          fi

          echo "Searching recent completed runs for the newest valid AI memory artifact."
          RUN_IDS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Run XAUT Bot" \
            --json databaseId,status \
            --limit 100 \
            --jq '.[] | select(.status == "completed") | .databaseId')

          RESTORED=false
          while IFS= read -r PREVIOUS_RUN_ID; do
            [ -n "$PREVIOUS_RUN_ID" ] || continue
            CANDIDATE_DIR=$(mktemp -d)
            echo "Checking AI memory artifact from run $PREVIOUS_RUN_ID."
            gh run download "$PREVIOUS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "xaut-ai-memory-$PREVIOUS_RUN_ID" \
              --dir "$CANDIDATE_DIR" >/dev/null 2>&1
            DOWNLOAD_STATUS=$?

            CANDIDATE_FILE="$CANDIDATE_DIR/ai_memory.json"
            if [ "$DOWNLOAD_STATUS" -eq 0 ] && [ -s "$CANDIDATE_FILE" ] && jq -e '
              type == "object" and
              (.schema_version == 1 or .schema_version == 2) and
              .symbol == "XAUTUSD" and
              (.model | type == "object") and
              (.model.weights | type == "object") and
              (.model.samples | type == "number") and
              (.evaluations | type == "array") and
              (.outcomes | type == "array")
            ' "$CANDIDATE_FILE" >/dev/null 2>&1; then
              CANDIDATE_UPDATED_AT="$(jq -r '.updated_at_utc // .created_at_utc // empty' "$CANDIDATE_FILE")"
              if [ -z "$CANDIDATE_UPDATED_AT" ]; then
                echo "Skipping artifact from run $PREVIOUS_RUN_ID: timestamp is missing."
                rm -rf "$CANDIDATE_DIR"
                continue
              fi

              if [ -z "$CURRENT_UPDATED_AT" ] || [[ "$CANDIDATE_UPDATED_AT" > "$CURRENT_UPDATED_AT" ]]; then
                cp "$CANDIDATE_FILE" "$CURRENT_FILE"
                echo "AI memory restored from run $PREVIOUS_RUN_ID (updated ${CANDIDATE_UPDATED_AT})."
              else
                echo "Existing AI memory is newer or equal; keeping the committed file."
              fi
              RESTORED=true
              rm -rf "$CANDIDATE_DIR"
              break
            fi
            rm -rf "$CANDIDATE_DIR"
          done <<< "$RUN_IDS"

          if [ "$RESTORED" != "true" ]; then
            echo "No valid AI memory artifact found in the last 100 completed runs; keeping the private-bot repository memory."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websocket-client

      - name: Show GitHub Runner Public IP
        run: |
          echo "=================================="
          echo "GITHUB RUNNER PUBLIC IPv4 ADDRESS"
          echo "=================================="
          IP=$(curl -4 -sS https://api.ipify.org)
          echo "YOUR IP ADDRESS: $IP"
          echo "=================================="
          echo "COPY THIS IP AND ADD IT TO DELTA"

      - name: Wait for Delta IP Whitelisting
        run: |
          echo "You have 90 seconds to add this IP to Delta."
          sleep 90
          echo "Waiting period completed."
          echo "Starting bot now."

      - name: Run XAUT Bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RECOVERY_STATE_REPOSITORY: ${{ github.repository }}
          RECOVERY_STATE_BRANCH: "xaut-recovery-state"
          REMOTE_RECOVERY_REQUIRED: "true"
          BOT_WATCHDOG_TIMEOUT_SECONDS: "180"
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          BOT_RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        working-directory: private-bot
        run: python -u bot.py

      - name: Upload trade history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-trade-history-${{ github.run_id }}
          path: private-bot/trade_history.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Upload AI shadow memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-ai-memory-${{ github.run_id }}
          path: private-bot/ai_memory.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-recovery-state-${{ github.run_id }}
          path: private-bot/bot_recovery_state.json
          if-no-files-found: ignore
          retention-days: 90
