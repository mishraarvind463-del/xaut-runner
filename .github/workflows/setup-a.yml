name: Run XAUT Bot

on:
  workflow_dispatch:
    inputs:
      enable_live_trading:
        description: "Enable REAL trading (use demo first)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private bot
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Restore latest recovery checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Searching recent completed runs for the newest available recovery checkpoint."
          RUN_IDS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Run XAUT Bot" \
            --json databaseId,status \
            --limit 20 \
            --jq '.[] | select(.status == "completed") | .databaseId')
          RESTORED=false
          while IFS= read -r PREVIOUS_RUN_ID; do
            [ -n "$PREVIOUS_RUN_ID" ] || continue
            CANDIDATE_DIR=$(mktemp -d)
            echo "Checking recovery artifact from run $PREVIOUS_RUN_ID."
            gh run download "$PREVIOUS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "xaut-recovery-state-$PREVIOUS_RUN_ID" \
              --dir "$CANDIDATE_DIR"
            DOWNLOAD_STATUS=$?
            if [ "$DOWNLOAD_STATUS" -eq 0 ] && [ -s "$CANDIDATE_DIR/bot_recovery_state.json" ]; then
              cp "$CANDIDATE_DIR/bot_recovery_state.json" private-bot/bot_recovery_state.json
              echo "Recovery checkpoint restored from run $PREVIOUS_RUN_ID."
              RESTORED=true
              rm -rf "$CANDIDATE_DIR"
              break
            fi
            rm -rf "$CANDIDATE_DIR"
          done <<< "$RUN_IDS"
          if [ "$RESTORED" != "true" ]; then
            echo "No recovery checkpoint found in the last 20 completed runs; bot will reconcile directly with Delta."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websocket-client

      - name: Show GitHub Runner Public IP
        run: |
          echo "=================================="
          echo "GITHUB RUNNER PUBLIC IPv4 ADDRESS"
          echo "=================================="
          IP=$(curl -4 -sS https://api.ipify.org)
          echo "YOUR IP ADDRESS: $IP"
          echo "=================================="
          echo "COPY THIS IP AND ADD IT TO DELTA"

      - name: Wait for Delta IP Whitelisting
        run: |
          echo "You have 90 seconds to add this IP to Delta."
          sleep 90
          echo "Waiting period completed."
          echo "Starting bot now."

      - name: Run XAUT Bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          BOT_RUNTIME_MINUTES: "5"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        working-directory: private-bot
        run: python -u bot.py

      - name: Upload trade history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-trade-history-${{ github.run_id }}
          path: private-bot/trade_history.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-recovery-state-${{ github.run_id }}
          path: private-bot/bot_recovery_state.json
          if-no-files-found: ignore
          retention-days: 30
