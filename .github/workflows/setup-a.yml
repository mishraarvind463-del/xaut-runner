name: Setup A
run-name: Setup A - Paper State v3

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Keep one bot run active. A newer dispatch can replace an older pending
# dispatch, but it cannot cancel the currently running bot.
concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    # 5-minute Paper test runtime plus startup, graceful shutdown, and checkpoint upload.
    timeout-minutes: 45

    steps:
      # Checkout this xaut-runner repository at the workspace root. The workflow
      # uses its tests/ directory and workflow files during restore validation.
      - name: Checkout runner repository
        id: checkout_runner
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private bot
        id: checkout_bot
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: private-bot/requirements.txt

      - name: Install dependencies
        id: install_dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r private-bot/requirements.txt

      - name: Detect Runner Public IP
        id: runner_ip
        timeout-minutes: 5
        run: |
          set -euo pipefail
          IP="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          if [[ ! "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Unable to determine a valid runner IPv4 address."
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "RUNNER PUBLIC IP: $IP"
          echo "::notice::Add this IP to the Delta Exchange API whitelist before the bot starts."

      - name: Wait for manual Delta IP whitelist approval
        id: ip_whitelist_wait
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "Waiting 90 seconds for manual Delta Exchange IP whitelist update."
          echo "This delay does NOT verify that the IP has been whitelisted."
          sleep 90

      - name: Validate workflow configuration
        id: validate_config
        timeout-minutes: 5
        env:
          ENABLE_LIVE_TRADING: "false"
          BOT_RUNTIME_MINUTES: "5"
        run: |
          set -euo pipefail
          [[ "$ENABLE_LIVE_TRADING" == "false" ]] || {
            echo "::error::Live trading must remain disabled."
            exit 1
          }
          [[ "$BOT_RUNTIME_MINUTES" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid BOT_RUNTIME_MINUTES."
            exit 1
          }
          (( BOT_RUNTIME_MINUTES >= 1 && BOT_RUNTIME_MINUTES <= 350 )) || {
            echo "::error::BOT_RUNTIME_MINUTES outside allowed test range."
            exit 1
          }
          echo "PAPER MODE CONFIGURATION VERIFIED."
          echo "BOT RUNTIME: ${BOT_RUNTIME_MINUTES} minutes"

      - name: Clear workspace runtime state before restore
        id: clear_runtime_state
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd private-bot
          rm -f paper_state.json
          rm -f trade_history.csv
          rm -f trade_history_legacy.csv
          rm -f execution_journal.json
          rm -f alert_state.json
          rm -f state_manifest.json
          echo "Workspace runtime state cleared before restore."

      - name: Restore latest verified Paper state
        id: restore_paper_state
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RECOVERY_WORKFLOW_PATH: ".github/workflows/manual-recovery.yml"
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt=1
            local max_attempts=4
            local delay=2
            while true; do
              if "$@"; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::GitHub API request failed after ${attempt} attempts."
                return 1
              fi
              echo "GitHub API request failed. Retry ${attempt}/${max_attempts} in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          download_artifact_with_retry() {
            local run_id="$1"
            local artifact_name="$2"
            local destination="$3"
            local attempt=1
            local max_attempts=4
            local delay=2
            mkdir -p "$destination"
            while true; do
              if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" \
                --dir "$destination"; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::Unable to download artifact ${artifact_name} from run ${run_id}."
                return 1
              fi
              echo "Artifact download failed. Retry ${attempt}/${max_attempts} in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          echo "Checking previous Setup A runs for a verified Paper checkpoint."

          RUNS_JSON="$(gh_retry api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/setup-a.yml/runs?branch=${GITHUB_REF_NAME}&status=completed&per_page=100")"

          PREVIOUS_RUN_ID=""
          PREVIOUS_ARTIFACT_NAME=""
          MANUAL_RECOVERY="false"
          BLOCKED_RUN_ID=""
          BLOCKED_RUN_ATTEMPT=""
          BLOCKED_CREATED_AT=""
          BLOCKED_ALLOW_SUCCESS="false"
          TARGET_BLOCKED_RUN_ID=""
          TARGET_BLOCKED_CREATED_AT=""
          TARGET_BLOCKED_RUN_ATTEMPT=""
          TARGET_BLOCKED_ALLOW_SUCCESS="false"

          mapfile -t PREVIOUS_RUN_IDS < <(
            printf '%s' "$RUNS_JSON" | jq -r \
              --arg current "$GITHUB_RUN_ID" '
                [.workflow_runs[]
                 | select((.id | tostring) != $current)
                 | select(.head_branch == env.GITHUB_REF_NAME)]
                | sort_by(.created_at, .id)
                | reverse
                | .[].id
              '
          )

          # Inspect prior runs for a start marker without a matching completed
          # checkpoint. Such a run may have stopped before persisting state.
          for CANDIDATE_BLOCKED_ID in "${PREVIOUS_RUN_IDS[@]}"; do
            CANDIDATE_BLOCKED_META="$(gh_retry api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_BLOCKED_ID}")"
            CANDIDATE_LATEST_ATTEMPT="$(printf '%s' "$CANDIDATE_BLOCKED_META" | jq -r '.run_attempt // 1')"
            CANDIDATE_ARTIFACTS="$(gh_retry api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_BLOCKED_ID}/artifacts?per_page=100")"

            CANDIDATE_HAS_FIXED_MARKER="false"
            CANDIDATE_HAS_FIXED_STATE="false"
            CANDIDATE_MARKER_ATTEMPT_MAX=0
            CANDIDATE_STATE_ATTEMPT_MAX=0

            while IFS= read -r ARTIFACT_NAME; do
              [[ -n "$ARTIFACT_NAME" ]] || continue
              if [[ "$ARTIFACT_NAME" =~ ^xaut-run-started-a([1-9][0-9]*)$ ]]; then
                CANDIDATE_HAS_FIXED_MARKER="true"
                ATTEMPT_NUM="${BASH_REMATCH[1]}"
                (( ATTEMPT_NUM > CANDIDATE_MARKER_ATTEMPT_MAX )) && CANDIDATE_MARKER_ATTEMPT_MAX="$ATTEMPT_NUM"
              fi
              if [[ "$ARTIFACT_NAME" =~ ^xaut-paper-state-a([1-9][0-9]*)$ ]]; then
                CANDIDATE_HAS_FIXED_STATE="true"
                ATTEMPT_NUM="${BASH_REMATCH[1]}"
                (( ATTEMPT_NUM > CANDIDATE_STATE_ATTEMPT_MAX )) && CANDIDATE_STATE_ATTEMPT_MAX="$ATTEMPT_NUM"
              fi
            done < <(printf '%s' "$CANDIDATE_ARTIFACTS" | jq -r \
              '.artifacts[]? | select(.expired == false) | .name')

            if [[ "$CANDIDATE_HAS_FIXED_MARKER" == "true" && "$CANDIDATE_HAS_FIXED_STATE" != "true" ]]; then
              TARGET_BLOCKED_RUN_ID="$CANDIDATE_BLOCKED_ID"
              TARGET_BLOCKED_CREATED_AT="$(printf '%s' "$CANDIDATE_BLOCKED_META" | jq -r '.run_started_at // .created_at // empty')"
              TARGET_BLOCKED_RUN_ATTEMPT="$CANDIDATE_LATEST_ATTEMPT"
              break
            fi

            if [[ "$CANDIDATE_STATE_ATTEMPT_MAX" -gt "$CANDIDATE_MARKER_ATTEMPT_MAX" ]]; then
              continue
            fi

            CANDIDATE_EVIDENCE_ATTEMPT_MAX=0
            if [[ "$CANDIDATE_MARKER_ATTEMPT_MAX" -gt 0 ]]; then
              CANDIDATE_EVIDENCE_ATTEMPT_MAX="$CANDIDATE_MARKER_ATTEMPT_MAX"
            else
              CANDIDATE_EVIDENCE_ATTEMPT_MAX=0
            fi
            if [[ "$CANDIDATE_STATE_ATTEMPT_MAX" -gt "$CANDIDATE_EVIDENCE_ATTEMPT_MAX" ]]; then
              CANDIDATE_EVIDENCE_ATTEMPT_MAX="$CANDIDATE_STATE_ATTEMPT_MAX"
            fi

            if [[ "$CANDIDATE_EVIDENCE_ATTEMPT_MAX" -gt 0 ]]; then
              CANDIDATE_ATTEMPT_JSON="$(gh_retry api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_BLOCKED_ID}/attempts/${CANDIDATE_EVIDENCE_ATTEMPT_MAX}")"
              CANDIDATE_CONCLUSION="$(printf '%s' "$CANDIDATE_ATTEMPT_JSON" | jq -r '.conclusion // ""')"
              case "$CANDIDATE_CONCLUSION" in
                failure|cancelled|timed_out)
                  TARGET_BLOCKED_RUN_ID="$CANDIDATE_BLOCKED_ID"
                  TARGET_BLOCKED_CREATED_AT="$(printf '%s' "$CANDIDATE_ATTEMPT_JSON" | jq -r '.run_started_at // .created_at // empty')"
                  TARGET_BLOCKED_RUN_ATTEMPT="$CANDIDATE_EVIDENCE_ATTEMPT_MAX"
                  break
                  ;;
                success)
                  if [[ "$CANDIDATE_STATE_ATTEMPT_MAX" -gt "$CANDIDATE_MARKER_ATTEMPT_MAX" ]]; then
                    TARGET_BLOCKED_RUN_ID="$CANDIDATE_BLOCKED_ID"
                    TARGET_BLOCKED_CREATED_AT="$(printf '%s' "$CANDIDATE_ATTEMPT_JSON" | jq -r '.run_started_at // .created_at // empty')"
                    TARGET_BLOCKED_RUN_ATTEMPT="$CANDIDATE_EVIDENCE_ATTEMPT_MAX"
                    TARGET_BLOCKED_ALLOW_SUCCESS="true"
                    break
                  fi
                  ;;
              esac
            elif [[ "$CANDIDATE_HAS_FIXED_MARKER" == "true" && "$CANDIDATE_HAS_FIXED_STATE" != "true" ]]; then
              TARGET_BLOCKED_RUN_ID="$CANDIDATE_BLOCKED_ID"
              TARGET_BLOCKED_CREATED_AT="$(printf '%s' "$CANDIDATE_BLOCKED_META" | jq -r '.run_started_at // .created_at // empty')"
              TARGET_BLOCKED_RUN_ATTEMPT="$CANDIDATE_LATEST_ATTEMPT"
              break
            fi
          done

          # If an earlier attempt/run is blocked, locate an explicit approval
          # artifact created after that blocked run. Approval is bound to the
          # exact source run and attempt in its JSON document.
          if [[ -n "$TARGET_BLOCKED_RUN_ID" ]]; then
            BLOCKED_RUN_ID="$TARGET_BLOCKED_RUN_ID"
            BLOCKED_CREATED_AT="$TARGET_BLOCKED_CREATED_AT"
            BLOCKED_RUN_ATTEMPT="$TARGET_BLOCKED_RUN_ATTEMPT"
            BLOCKED_ALLOW_SUCCESS="$TARGET_BLOCKED_ALLOW_SUCCESS"

            echo "BLOCKED SETUP A RUN DETECTED: ${BLOCKED_RUN_ID} attempt ${BLOCKED_RUN_ATTEMPT}"
            APPROVAL_RUN_IDS_TEXT="$(printf '%s' "$RUNS_JSON" | jq -r \
              --arg blocked "$BLOCKED_RUN_ID" \
              --arg workflow "$RECOVERY_WORKFLOW_PATH" \
              --arg branch "$GITHUB_REF_NAME" \
              --arg blocked_at "$BLOCKED_CREATED_AT" '
                [
                  .[].workflow_runs[]?
                  | select(.status == "completed" and .conclusion == "success")
                  | select(.head_branch == $branch)
                  | select(.event == "workflow_dispatch")
                  | select(((.path // "") | split("@")[0]) == $workflow)
                  | select(.created_at > $blocked_at)
                ]
                | sort_by(.created_at, .id)
                | reverse
                | .[].id
              ')"

            APPROVAL_FOUND="false"
            while IFS= read -r APPROVAL_RUN_ID; do
              [[ -n "$APPROVAL_RUN_ID" ]] || continue
              APPROVAL_ARTIFACTS="$(gh_retry api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVAL_RUN_ID}/artifacts?per_page=100")"
              APPROVAL_ARTIFACT_NAMES="$(printf '%s' "$APPROVAL_ARTIFACTS" | jq -r \
                '.artifacts[]? | select(.expired == false) | .name')"

              while IFS= read -r APPROVAL_ARTIFACT_NAME; do
                [[ "$APPROVAL_ARTIFACT_NAME" =~ ^xaut-manual-recovery-approved-a[1-9][0-9]*$ ]] || continue
                APPROVAL_DIR="$(mktemp -d)"
                if ! download_artifact_with_retry "$APPROVAL_RUN_ID" "$APPROVAL_ARTIFACT_NAME" "$APPROVAL_DIR"; then
                  rm -rf "$APPROVAL_DIR"
                  continue
                fi
                APPROVAL_FILE="$(find "$APPROVAL_DIR" -maxdepth 2 -type f -name 'approval.json' -print -quit)"
                if [[ -n "$APPROVAL_FILE" ]] && jq -e \
                  --arg blocked "$BLOCKED_RUN_ID" \
                  --arg attempt "$BLOCKED_RUN_ATTEMPT" \
                  '.source_run_id == $blocked and (.source_attempt | tostring) == $attempt and .confirmation == "RESTORE_XAUTUSD_PAPER_STATE"' \
                  "$APPROVAL_FILE" >/dev/null; then
                  APPROVAL_FOUND="true"
                  echo "MANUAL RECOVERY APPROVAL VERIFIED FOR BLOCKED RUN: ${BLOCKED_RUN_ID}"
                  rm -rf "$APPROVAL_DIR"
                  break 2
                fi
                rm -rf "$APPROVAL_DIR"
              done <<< "$APPROVAL_ARTIFACT_NAMES"
            done <<< "$APPROVAL_RUN_IDS_TEXT"

            if [[ "$APPROVAL_FOUND" != "true" ]]; then
              echo "::error::A blocked Setup A run was found. Run Manual Recovery and approve this exact source run/attempt before continuing."
              echo "Blocked run: ${BLOCKED_RUN_ID}"
              echo "Blocked attempt: ${BLOCKED_RUN_ATTEMPT}"
              exit 1
            fi
            MANUAL_RECOVERY="true"
          fi

          # A successful, newer verified checkpoint takes precedence over any
          # older approved recovery source. Do not roll state backwards silently.
          for CANDIDATE_RUN_ID in "${PREVIOUS_RUN_IDS[@]}"; do
            CANDIDATE_ARTIFACTS="$(gh_retry api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100")"
            CANDIDATE_STATE_NAME="$(printf '%s' "$CANDIDATE_ARTIFACTS" | jq -r '
              [.artifacts[]? | select(.expired == false)
               | select(.name | test("^xaut-paper-state-a[1-9][0-9]*$"))]
              | sort_by(.created_at)
              | reverse
              | .[0].name // empty
            ')"
            if [[ -z "$CANDIDATE_STATE_NAME" ]]; then
              CANDIDATE_STATE_NAME="$(printf '%s' "$CANDIDATE_ARTIFACTS" | jq -r '
                if any(.artifacts[]?; .name == "xaut-paper-state" and .expired == false)
                then "xaut-paper-state" else empty end
              ')"
            fi
            if [[ -n "$CANDIDATE_STATE_NAME" ]]; then
              CANDIDATE_RUN_META="$(gh_retry api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
              CANDIDATE_CONCLUSION="$(printf '%s' "$CANDIDATE_RUN_META" | jq -r '.conclusion // ""')"
              CANDIDATE_STATUS="$(printf '%s' "$CANDIDATE_RUN_META" | jq -r '.status // ""')"
              if [[ "$CANDIDATE_STATUS" == "completed" && "$CANDIDATE_CONCLUSION" == "success" ]]; then
                PREVIOUS_RUN_ID="$CANDIDATE_RUN_ID"
                PREVIOUS_ARTIFACT_NAME="$CANDIDATE_STATE_NAME"
                break
              fi
            fi
          done

          # An explicitly approved recovery source is used only if no newer
          # successful checkpoint was found.
          if [[ -z "$PREVIOUS_RUN_ID" && "$MANUAL_RECOVERY" == "true" ]]; then
            PREVIOUS_RUN_ID="$BLOCKED_RUN_ID"
            PREVIOUS_ARTIFACT_NAME="xaut-paper-state-a${BLOCKED_RUN_ATTEMPT}"
          fi

          if [[ -z "$PREVIOUS_RUN_ID" ]]; then
            echo "No previous verified Paper checkpoint found. Starting with a clean Paper state."
            exit 0
          fi

          echo "Downloading Paper state artifact from run ${PREVIOUS_RUN_ID}: ${PREVIOUS_ARTIFACT_NAME}"
          RESTORE_DIR="$(mktemp -d)"
          download_artifact_with_retry "$PREVIOUS_RUN_ID" "$PREVIOUS_ARTIFACT_NAME" "$RESTORE_DIR"

          MANIFEST_PATH="$(find "$RESTORE_DIR" -maxdepth 3 -type f -name 'state_manifest.json' -print -quit)"
          if [[ -z "$MANIFEST_PATH" ]]; then
            echo "::error::Checkpoint artifact does not contain state_manifest.json."
            exit 1
          fi

          python - "$RESTORE_DIR" "$MANIFEST_PATH" "$PREVIOUS_RUN_ID" "$PREVIOUS_ARTIFACT_NAME" <<'PY'
          import hashlib
          import json
          import math
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          manifest_path = Path(sys.argv[2]).resolve()
          source_run_id = sys.argv[3]
          artifact_name = sys.argv[4]
          allowed = {
              "paper_state.json",
              "alert_state.json",
              "trade_history.csv",
              "trade_history_legacy.csv",
              "execution_journal.json",
          }

          def fail(message):
              raise SystemExit(f"RESTORE VALIDATION FAILED: {message}")

          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception as error:
              fail(f"manifest JSON is invalid: {error!r}")
          if not isinstance(manifest, dict) or manifest.get("schema_version") != 1:
              fail("manifest schema is unsupported")
          if manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
              fail("manifest instrument identity mismatch")
          if manifest.get("mode") != "PAPER":
              fail("manifest is not Paper mode")
          run = manifest.get("run")
          if not isinstance(run, dict) or str(run.get("workflow_run_id", "")) != source_run_id:
              fail("manifest source run ID mismatch")
          records = manifest.get("files")
          if not isinstance(records, dict) or "paper_state.json" not in records:
              fail("manifest does not include paper_state.json")
          names = set(records)
          if not names.issubset(allowed):
              fail(f"manifest includes unsupported files: {sorted(names - allowed)}")

          for name, record in records.items():
              if not isinstance(record, dict):
                  fail(f"invalid manifest record for {name}")
              source = (root / name).resolve()
              if root not in source.parents:
                  fail(f"path traversal detected for {name}")
              if not source.is_file():
                  fail(f"checkpoint file missing: {name}")
              expected_size = int(record.get("size_bytes", -1))
              if source.stat().st_size != expected_size:
                  fail(f"file size mismatch: {name}")
              expected_hash = str(record.get("sha256", ""))
              actual_hash = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  fail(f"SHA256 mismatch: {name}")

          for name in records:
              destination = Path("private-bot") / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / name, destination)

          print("CHECKPOINT MANIFEST VERIFIED:", ", ".join(sorted(records)))
          print("PAPER STATE RESTORED AND VALIDATED FROM RUN ARTIFACT.")
          PY

      - name: Create run-start marker
        id: create_run_marker
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKER_DIR="$(mktemp -d)"
          printf '{"workflow_run_id":"%s","run_attempt":%s,"symbol":"XAUTUSD","product_id":131253,"mode":"PAPER"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$MARKER_DIR/run_started.json"
          ARTIFACT_NAME="xaut-run-started-a${GITHUB_RUN_ATTEMPT}"
          gh run upload-artifact "$ARTIFACT_NAME" "$MARKER_DIR/run_started.json" \
            --repo "$GITHUB_REPOSITORY" \
            --retention-days 30
          echo "RUN START MARKER UPLOADED: ${ARTIFACT_NAME}"

      - name: Validate restored state and bot files
        id: validate_restored_state
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd private-bot
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          state = Path("paper_state.json")
          history = Path("trade_history.csv")
          journal = Path("execution_journal.json")
          alerts = Path("alert_state.json")

          if state.exists():
              data = json.loads(state.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("paper_state.json must contain a JSON object")
              print("PAPER STATE JSON VALID.")
          else:
              print("No prior Paper state file; clean start.")

          if journal.exists():
              data = json.loads(journal.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("execution_journal.json must contain a JSON object")
              print("EXECUTION JOURNAL JSON VALID.")

          if alerts.exists():
              data = json.loads(alerts.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("alert_state.json must contain a JSON object")
              print("ALERT STATE JSON VALID.")

          if history.exists():
              with history.open(newline="", encoding="utf-8") as handle:
                  rows = list(csv.reader(handle))
              if not rows:
                  raise SystemExit("trade_history.csv is empty")
              print(f"TRADE HISTORY CSV VALID: {len(rows) - 1} data rows.")
          else:
              print("No prior trade history file; clean start.")
          PY

          test -f bot.py
          echo "BOT FILE VERIFIED."

      - name: Run Paper trading bot
        id: run_bot
        timeout-minutes: 25
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: "false"
          LIVE_TRADING_CONFIRM: ""
          BOT_RUNTIME_MINUTES: "5"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd private-bot
          echo "MODE: PAPER"
          echo "LIVE TRADING: DISABLED"
          echo "BOT RUNTIME: ${BOT_RUNTIME_MINUTES} minutes"
          python bot.py

      - name: Final state validation and manifest creation
        id: create_checkpoint_manifest
        if: always()
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cd private-bot

          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          files = [
              "paper_state.json",
              "trade_history.csv",
              "trade_history_legacy.csv",
              "execution_journal.json",
              "alert_state.json",
          ]

          existing = {}
          for name in files:
              path = Path(name)
              if path.is_file():
                  existing[name] = {
                      "size_bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }

          if "paper_state.json" not in existing:
              print("::error::paper_state.json missing; refusing to create checkpoint manifest.")
              sys.exit(1)

          manifest = {
              "schema_version": 1,
              "symbol": "XAUTUSD",
              "product_id": 131253,
              "mode": "PAPER",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "run": {
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "workflow": os.environ["GITHUB_WORKFLOW"],
                  "ref": os.environ["GITHUB_REF"],
                  "sha": os.environ["GITHUB_SHA"],
              },
              "files": existing,
          }

          Path("state_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("STATE CHECKPOINT MANIFEST CREATED: state_manifest.json")
          print("FILES:", ",".join(existing))
          PY

      - name: Verify checkpoint before upload
        id: verify_checkpoint
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd private-bot
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("state_manifest.json").read_text(encoding="utf-8"))
          if manifest.get("symbol") != "XAUTUSD" or manifest.get("product_id") != 131253:
              raise SystemExit("Checkpoint instrument identity mismatch.")
          if manifest.get("mode") != "PAPER":
              raise SystemExit("Checkpoint mode is not PAPER.")
          for name, record in manifest["files"].items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Checkpoint file missing: {name}")
              if path.stat().st_size != record["size_bytes"]:
                  raise SystemExit(f"Checkpoint size mismatch: {name}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != record["sha256"]:
                  raise SystemExit(f"Checkpoint SHA256 mismatch: {name}")
          print("CHECKPOINT MANIFEST AND FILE HASHES VERIFIED.")
          PY

      - name: Upload Paper state checkpoint
        id: upload_paper_state
        if: always() && steps.verify_checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: xaut-paper-state-a${{ github.run_attempt }}
          path: |
            private-bot/paper_state.json
            private-bot/trade_history.csv
            private-bot/trade_history_legacy.csv
            private-bot/execution_journal.json
            private-bot/alert_state.json
            private-bot/state_manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Verify uploaded checkpoint artifact
        id: verify_uploaded_checkpoint
        if: always() && steps.upload_paper_state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="xaut-paper-state-a${GITHUB_RUN_ATTEMPT}"
          ARTIFACTS="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          ARTIFACT_ID="$(printf '%s' "$ARTIFACTS" | jq -r \
            --arg name "$ARTIFACT_NAME" \
            '.artifacts[]? | select(.name == $name and .expired == false) | .id' | head -n 1)"
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::Uploaded Paper checkpoint artifact not found."
            exit 1
          fi
          echo "Verified uploaded checkpoint artifact: ${ARTIFACT_NAME} (ID ${ARTIFACT_ID})."

      - name: Upload diagnostic logs
        id: upload_diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-diagnostics-a${{ github.run_attempt }}
          path: |
            private-bot/*.log
            private-bot/*.txt
            private-bot/*.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
