name: Setup A
run-name: Setup A - Paper State v3

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Keep one bot run active. A newer dispatch can replace an older pending
# dispatch, but it cannot cancel the currently running bot.
concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a maximum timeout of 360 minutes.
    timeout-minutes: 360

    steps:
      - name: Checkout private bot
        id: checkout_bot
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        timeout-minutes: 10
        with:
          python-version: "3.12"

      - name: Clear workspace runtime state before restore
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_files = [
              "paper_state.json",
              "alert_state.json",
              "trade_history.csv",
              "trade_history_legacy.csv",
              "execution_journal.json",
              "state_manifest.json",
              "paper_state.json.tmp",
              "alert_state.json.tmp",
              "trade_history.csv.tmp",
              "trade_history_legacy.csv.tmp",
              "execution_journal.json.tmp",
              "state_manifest.json.tmp",
          ]

          for name in runtime_files:
              path = Path(name)
              if path.is_symlink() or path.is_file():
                  path.unlink()
              elif path.exists():
                  raise SystemExit(f"Unexpected directory at runtime-state path: {name}")
          print("Workspace runtime-state paths cleared before restore.")
          PY

      - name: Restore latest verified Paper state
        id: restore_state
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_PATH=".github/workflows/setup-a.yml"
          RECOVERY_WORKFLOW_PATH=".github/workflows/manual-recovery.yml"

          # Retry read-only GitHub CLI requests for transient API/network errors.
          gh_retry() {
            local attempt output status
            for attempt in 1 2 3 4 5; do
              if output="$(gh "$@" 2>&1)"; then
                printf '%s' "$output"
                return 0
              else
                status=$?
                echo "::warning::GitHub CLI request failed (attempt ${attempt}/5, exit ${status}): ${output}" >&2
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep $((attempt * 2))
              fi
            done
            echo "::error::GitHub CLI request failed after 5 attempts." >&2
            return 1
          }

          download_artifact_with_retry() {
            local run_id="$1"
            local artifact_name="$2"
            local destination="$3"
            local attempt output status

            for attempt in 1 2 3 4; do
              rm -rf "$destination"
              mkdir -p "$destination"
              if output="$(gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" \
                --dir "$destination" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
                echo "::warning::Artifact download failed (attempt ${attempt}/4, exit ${status}): ${output}" >&2
              fi
              if [[ "$attempt" -lt 4 ]]; then
                sleep $((attempt * 3))
              fi
            done
            echo "::error::Artifact download failed after 4 attempts: ${artifact_name}" >&2
            return 1
          }

          RUNS_JSON="$(gh_retry api --method GET --paginate --slurp \
            -f "branch=${GITHUB_REF_NAME}" \
            -f "event=workflow_dispatch" \
            -F "per_page=100" \
            "repos/${GITHUB_REPOSITORY}/actions/runs")"

          # Use command substitution rather than process substitution so a jq
          # parsing failure is surfaced by set -e / pipefail.
          PREVIOUS_RUN_IDS_TEXT="$(printf '%s' "$RUNS_JSON" | jq -r \
            --arg current "$GITHUB_RUN_ID" \
            --arg workflow "$WORKFLOW_PATH" \
            --arg branch "$GITHUB_REF_NAME" '
              [
                .[].workflow_runs[]?
                | select((.id | tostring) != $current)
                | select(.status == "completed")
                | select(.head_branch == $branch)
                | select(.event == "workflow_dispatch")
                | select(((.path // "") | split("@")[0]) == $workflow)
              ]
              | sort_by(.created_at, .id)
              | reverse
              | .[].id
            ')"

          PREVIOUS_RUN_IDS=()
          if [[ -n "$PREVIOUS_RUN_IDS_TEXT" ]]; then
            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] && PREVIOUS_RUN_IDS+=("$run_id")
            done <<< "$PREVIOUS_RUN_IDS_TEXT"
          fi

          PREVIOUS_RUN_ID=""
          PREVIOUS_ARTIFACT_NAME=""
          LEGACY_RUN_ID=""
          MANUAL_RECOVERY="false"
          RECOVERY_REQUIRED="false"
          BLOCKED_RUN_ID=""
          BLOCKED_CREATED_AT=""

          CURRENT_RUN_CREATED_AT="$(printf '%s' "$RUNS_JSON" | jq -r \
            --arg current "$GITHUB_RUN_ID" \
            '[.[].workflow_runs[]? | select((.id | tostring) == $current) | .created_at][0] // empty')"
          if [[ -z "$CURRENT_RUN_CREATED_AT" ]]; then
            CURRENT_RUN_CREATED_AT="$(gh_retry api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r '.created_at')"
          fi

          # A GitHub re-run keeps the same run ID. Inspect artifacts from
          # earlier attempts of this very run before looking at older run IDs.
          CURRENT_ARTIFACTS_JSON="$(gh_retry api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          CURRENT_MARKER_ATTEMPT_MAX="$(printf '%s' "$CURRENT_ARTIFACTS_JSON" | jq -r '
            [.artifacts[]? | select(.name | test("^xaut-run-started-a[0-9]+$"))
             | (.name | capture("^xaut-run-started-a(?<attempt>[0-9]+)$").attempt | tonumber)]
            | if length == 0 then 0 else max end
          ')"
          CURRENT_STATE_ATTEMPT_MAX="$(printf '%s' "$CURRENT_ARTIFACTS_JSON" | jq -r '
            [.artifacts[]? | select(.expired == false)
             | select(.name | test("^xaut-paper-state-a[0-9]+$"))
             | (.name | capture("^xaut-paper-state-a(?<attempt>[0-9]+)$").attempt | tonumber)]
            | if length == 0 then 0 else max end
          ')"
          CURRENT_FIXED_STATE="$(printf '%s' "$CURRENT_ARTIFACTS_JSON" | jq -r '
            any(.artifacts[]?; .name == "xaut-paper-state" and .expired == false)
          ')"
          CURRENT_FIXED_MARKER="$(printf '%s' "$CURRENT_ARTIFACTS_JSON" | jq -r '
            any(.artifacts[]?; .name == "xaut-run-started")
          ')"

          # A manual approval is a deliberate override for one exact blocked run.
          # Check for it before preferring a checkpoint artifact that may exist but be corrupt.
          TARGET_BLOCKED_RUN_ID=""
          TARGET_BLOCKED_CREATED_AT=""
          TARGET_BLOCKED_RUN_ATTEMPT=""

          # A re-run keeps its run ID. Check the exact earlier attempt that
          # produced the marker; a marker by itself does not make a successful
          # attempt blocked.
          if [[ "$CURRENT_MARKER_ATTEMPT_MAX" -gt 0 && "$CURRENT_MARKER_ATTEMPT_MAX" -lt "$GITHUB_RUN_ATTEMPT" ]]; then
            CURRENT_PRIOR_ATTEMPT_JSON="$(gh_retry api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${CURRENT_MARKER_ATTEMPT_MAX}")"
            printf '%s' "$CURRENT_PRIOR_ATTEMPT_JSON" | jq -e --arg attempt "$CURRENT_MARKER_ATTEMPT_MAX" \
              '(.run_attempt | tostring) == $attempt and .status == "completed"' >/dev/null || {
                echo "::error::Could not validate the exact earlier Setup A attempt."; exit 1;
              }
            CURRENT_PRIOR_CONCLUSION="$(printf '%s' "$CURRENT_PRIOR_ATTEMPT_JSON" | jq -r '.conclusion // ""')"
            case "$CURRENT_PRIOR_CONCLUSION" in
              failure|cancelled|timed_out)
                TARGET_BLOCKED_RUN_ID="$GITHUB_RUN_ID"
                TARGET_BLOCKED_CREATED_AT="$(printf '%s' "$CURRENT_PRIOR_ATTEMPT_JSON" | jq -r '.run_started_at // .created_at // empty')"
                TARGET_BLOCKED_RUN_ATTEMPT="$CURRENT_MARKER_ATTEMPT_MAX"
                ;;
            esac
          elif [[ "$CURRENT_FIXED_MARKER" == "true" && "$CURRENT_FIXED_STATE" != "true" && "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            TARGET_BLOCKED_RUN_ID="$GITHUB_RUN_ID"
            TARGET_BLOCKED_CREATED_AT="$CURRENT_RUN_CREATED_AT"
            TARGET_BLOCKED_RUN_ATTEMPT="$((GITHUB_RUN_ATTEMPT - 1))"
          fi

          if [[ -z "$TARGET_BLOCKED_RUN_ID" && "${#PREVIOUS_RUN_IDS[@]}" -gt 0 ]]; then
            for CANDIDATE_BLOCKED_ID in "${PREVIOUS_RUN_IDS[@]}"; do
              CANDIDATE_BLOCKED_META="$(printf '%s' "$RUNS_JSON" | jq -c --arg id "$CANDIDATE_BLOCKED_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id)][0] // empty')"
              CANDIDATE_BLOCKED_RUN_ATTEMPT="$(printf '%s' "$CANDIDATE_BLOCKED_META" | jq -r '.run_attempt | tostring')"
              [[ "$CANDIDATE_BLOCKED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || continue
              CANDIDATE_BLOCKED_ATTEMPT_META="$(gh_retry api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_BLOCKED_ID}/attempts/${CANDIDATE_BLOCKED_RUN_ATTEMPT}")"
              printf '%s' "$CANDIDATE_BLOCKED_ATTEMPT_META" | jq -e --arg attempt "$CANDIDATE_BLOCKED_RUN_ATTEMPT" \
                '(.run_attempt | tostring) == $attempt and .status == "completed"' >/dev/null || {
                  echo "::error::Could not validate exact Setup A attempt ${CANDIDATE_BLOCKED_RUN_ATTEMPT}."; exit 1;
                }
              CANDIDATE_BLOCKED_CONCLUSION="$(printf '%s' "$CANDIDATE_BLOCKED_ATTEMPT_META" | jq -r '.conclusion // ""')"
              case "$CANDIDATE_BLOCKED_CONCLUSION" in
                failure|cancelled|timed_out) ;;
                *) continue ;;
              esac
              CANDIDATE_BLOCKED_ARTIFACTS="$(gh_retry api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_BLOCKED_ID}/artifacts?per_page=100")"
              CANDIDATE_BLOCKED_TITLE="$(printf '%s' "$CANDIDATE_BLOCKED_META" | jq -r '.display_title // .name // ""')"
              HAS_EXACT_BLOCKED_MARKER="$(printf '%s' "$CANDIDATE_BLOCKED_ARTIFACTS" | jq -r \
                --arg marker "xaut-run-started-a${CANDIDATE_BLOCKED_RUN_ATTEMPT}" \
                --argjson attempt "$CANDIDATE_BLOCKED_RUN_ATTEMPT" '
                  any(.artifacts[]?; .name == $marker and .expired == false) or
                  ($attempt == 1 and any(.artifacts[]?; .name == "xaut-run-started" and .expired == false))
                ')"
              if [[ "$HAS_EXACT_BLOCKED_MARKER" == "true" || "$CANDIDATE_BLOCKED_TITLE" == *"Paper State v2"* ]]; then
                TARGET_BLOCKED_RUN_ID="$CANDIDATE_BLOCKED_ID"
                TARGET_BLOCKED_CREATED_AT="$(printf '%s' "$CANDIDATE_BLOCKED_ATTEMPT_META" | jq -r '.run_started_at // .created_at // empty')"
                TARGET_BLOCKED_RUN_ATTEMPT="$CANDIDATE_BLOCKED_RUN_ATTEMPT"
                break
              fi
            done
          fi

          if [[ -n "$TARGET_BLOCKED_RUN_ID" && -n "$TARGET_BLOCKED_CREATED_AT" ]]; then
            APPROVED_RECOVERY_IDS="$(printf '%s' "$RUNS_JSON" | jq -r \
              --arg recovery_workflow "$RECOVERY_WORKFLOW_PATH" \
              --arg branch "$GITHUB_REF_NAME" \
              --arg blocked_at "$TARGET_BLOCKED_CREATED_AT" '
                [.[].workflow_runs[]?
                 | select(.head_branch == $branch)
                 | select(.event == "workflow_dispatch")
                 | select(.status == "completed" and .conclusion == "success")
                 | select(((.path // "") | split("@")[0]) == $recovery_workflow)
                 | select(.created_at > $blocked_at)]
                | sort_by(.created_at, .id)
                | reverse
                | .[].id
              ')"
            if [[ -n "$APPROVED_RECOVERY_IDS" ]]; then
              while IFS= read -r APPROVED_RECOVERY_ID; do
                [[ -n "$APPROVED_RECOVERY_ID" ]] || continue
                APPROVED_RECOVERY_ARTIFACTS="$(gh_retry api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVED_RECOVERY_ID}/artifacts?per_page=100")"
                APPROVED_RECOVERY_ATTEMPT="$(printf '%s' "$RUNS_JSON" | jq -r --arg id "$APPROVED_RECOVERY_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id) | .run_attempt][0] // empty')"
                APPROVED_RECOVERY_ARTIFACT_NAME="xaut-manual-recovery-approved-a${APPROVED_RECOVERY_ATTEMPT}"
                if printf '%s' "$APPROVED_RECOVERY_ARTIFACTS" | jq -e --arg run "$APPROVED_RECOVERY_ID" --arg name "$APPROVED_RECOVERY_ARTIFACT_NAME" '
                  any(.artifacts[]?; .name == $name and .expired == false and (.workflow_run.id | tostring) == $run)
                ' >/dev/null; then
                  PREVIOUS_RUN_ID="$APPROVED_RECOVERY_ID"
                  PREVIOUS_ARTIFACT_NAME="$APPROVED_RECOVERY_ARTIFACT_NAME"
                  MANUAL_RECOVERY="true"
                  BLOCKED_RUN_ID="$TARGET_BLOCKED_RUN_ID"
                  BLOCKED_CREATED_AT="$TARGET_BLOCKED_CREATED_AT"
                  BLOCKED_RUN_ATTEMPT="$TARGET_BLOCKED_RUN_ATTEMPT"
                  echo "Using explicit manual-recovery approval for blocked Setup A run ${BLOCKED_RUN_ID}, attempt ${BLOCKED_RUN_ATTEMPT}."
                  break
                fi
              done <<< "$APPROVED_RECOVERY_IDS"
            fi
          fi

          if [[ "$MANUAL_RECOVERY" != "true" ]]; then
          if [[ "$CURRENT_MARKER_ATTEMPT_MAX" -gt "$CURRENT_STATE_ATTEMPT_MAX" ]]; then
            echo "::warning::This run has a previous attempt that started the bot but did not save a checkpoint."
            RECOVERY_REQUIRED="true"
            BLOCKED_RUN_ID="$GITHUB_RUN_ID"
            BLOCKED_CREATED_AT="$CURRENT_RUN_CREATED_AT"
          elif [[ "$CURRENT_STATE_ATTEMPT_MAX" -gt 0 ]]; then
            if [[ "$CURRENT_MARKER_ATTEMPT_MAX" -ne "$CURRENT_STATE_ATTEMPT_MAX" ]]; then
              echo "::warning::Current-run checkpoint and start-marker attempts do not match."
              RECOVERY_REQUIRED="true"
              BLOCKED_RUN_ID="$GITHUB_RUN_ID"
              BLOCKED_CREATED_AT="$CURRENT_RUN_CREATED_AT"
            else
              PREVIOUS_RUN_ID="$GITHUB_RUN_ID"
              PREVIOUS_ARTIFACT_NAME="xaut-paper-state-a${CURRENT_STATE_ATTEMPT_MAX}"
              echo "Re-running this GitHub run; restoring its latest complete attempt ${CURRENT_STATE_ATTEMPT_MAX}."
            fi
          elif [[ "$CURRENT_FIXED_STATE" == "true" ]]; then
            PREVIOUS_RUN_ID="$GITHUB_RUN_ID"
            PREVIOUS_ARTIFACT_NAME="xaut-paper-state"
            echo "Re-running a legacy attempt; restoring its fixed-name state artifact."
          elif [[ "$CURRENT_FIXED_MARKER" == "true" ]]; then
            echo "::warning::This run has a legacy start marker but no matching state artifact."
            RECOVERY_REQUIRED="true"
            BLOCKED_RUN_ID="$GITHUB_RUN_ID"
            BLOCKED_CREATED_AT="$CURRENT_RUN_CREATED_AT"
          fi

          if [[ -z "$PREVIOUS_RUN_ID" && "$RECOVERY_REQUIRED" != "true" ]]; then
            for RUN_ID in "${PREVIOUS_RUN_IDS[@]}"; do
              RUN_TITLE="$(printf '%s' "$RUNS_JSON" | jq -r \
                --arg id "$RUN_ID" '
                  .[].workflow_runs[]?
                  | select((.id | tostring) == $id)
                  | (.display_title // .name // "")
                ' | head -n 1)"

              ARTIFACTS_JSON="$(gh_retry api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"

              MARKER_ATTEMPT_MAX="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '
                [.artifacts[]? | select(.name | test("^xaut-run-started-a[0-9]+$"))
                 | (.name | capture("^xaut-run-started-a(?<attempt>[0-9]+)$").attempt | tonumber)]
                | if length == 0 then 0 else max end
              ')"
              STATE_ATTEMPT_MAX="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '
                [.artifacts[]? | select(.expired == false)
                 | select(.name | test("^xaut-paper-state-a[0-9]+$"))
                 | (.name | capture("^xaut-paper-state-a(?<attempt>[0-9]+)$").attempt | tonumber)]
                | if length == 0 then 0 else max end
              ')"
              HAS_STATE="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '
                any(.artifacts[]?; .name == "xaut-paper-state" and .expired == false)
              ')"
              HAS_START_MARKER="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '
                any(.artifacts[]?; .name == "xaut-run-started")
              ')"
              HAS_LEGACY="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '
                any(.artifacts[]?; .name == "xaut-paper-trade-history" and .expired == false)
              ')"

              if [[ "$MARKER_ATTEMPT_MAX" -gt "$STATE_ATTEMPT_MAX" ]]; then
                echo "::warning::Run ${RUN_ID} has a bot-started attempt without a verified state artifact."
                RECOVERY_REQUIRED="true"
                BLOCKED_RUN_ID="$RUN_ID"
                BLOCKED_CREATED_AT="$(printf '%s' "$RUNS_JSON" | jq -r --arg id "$RUN_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id) | .created_at][0] // empty')"
                break
              elif [[ "$STATE_ATTEMPT_MAX" -gt 0 ]]; then
                if [[ "$MARKER_ATTEMPT_MAX" -ne "$STATE_ATTEMPT_MAX" ]]; then
                  echo "::warning::Run ${RUN_ID} checkpoint/start-marker attempts do not match."
                  RECOVERY_REQUIRED="true"
                  BLOCKED_RUN_ID="$RUN_ID"
                  BLOCKED_CREATED_AT="$(printf '%s' "$RUNS_JSON" | jq -r --arg id "$RUN_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id) | .created_at][0] // empty')"
                  break
                fi
                PREVIOUS_RUN_ID="$RUN_ID"
                PREVIOUS_ARTIFACT_NAME="xaut-paper-state-a${STATE_ATTEMPT_MAX}"
                echo "Verified state from run ${RUN_ID}, attempt ${STATE_ATTEMPT_MAX} (${RUN_TITLE})."
                break
              fi

              if [[ "$HAS_STATE" == "true" ]]; then
                PREVIOUS_RUN_ID="$RUN_ID"
                PREVIOUS_ARTIFACT_NAME="xaut-paper-state"
                echo "Legacy verified-state candidate found: run ${RUN_ID} (${RUN_TITLE})."
                break
              fi

              # The fixed-name marker belongs to an earlier v3 prototype. A
              # marker without a fixed-name state artifact is ambiguous.
              if [[ "$HAS_START_MARKER" == "true" ]]; then
                echo "::warning::Run ${RUN_ID} has a legacy bot-start marker but no usable state checkpoint."
                RECOVERY_REQUIRED="true"
                BLOCKED_RUN_ID="$RUN_ID"
                BLOCKED_CREATED_AT="$(printf '%s' "$RUNS_JSON" | jq -r --arg id "$RUN_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id) | .created_at][0] // empty')"
                break
              fi

              # Older v2 workflows had no start marker. Missing/expired state for
              # such a run is ambiguous and must be explicitly recovered.
              if [[ "$RUN_TITLE" == *"Paper State v2"* ]]; then
                echo "::warning::Previous Paper State v2 run ${RUN_ID} has no usable state artifact."
                RECOVERY_REQUIRED="true"
                BLOCKED_RUN_ID="$RUN_ID"
                BLOCKED_CREATED_AT="$(printf '%s' "$RUNS_JSON" | jq -r --arg id "$RUN_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id) | .created_at][0] // empty')"
                break
              fi

              if [[ "$RUN_TITLE" == *"Paper State v3"* ]]; then
                echo "Skipping run ${RUN_ID}: bot-start marker was never uploaded. Bot did not start."
              else
                echo "Skipping pre-checkpoint/legacy run ${RUN_ID}: ${RUN_TITLE}"
              fi

              if [[ "$HAS_LEGACY" == "true" && -z "$LEGACY_RUN_ID" ]]; then
                LEGACY_RUN_ID="$RUN_ID"
              fi
            done
          fi
          fi # end normal previous-state selection; an approved recovery takes precedence

          if [[ "$RECOVERY_REQUIRED" == "true" && "$MANUAL_RECOVERY" != "true" ]]; then
            if [[ -z "$BLOCKED_RUN_ATTEMPT" && -n "$BLOCKED_RUN_ID" ]]; then
              BLOCKED_RUN_ATTEMPT="$(printf '%s' "$RUNS_JSON" | jq -r --arg id "$BLOCKED_RUN_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id) | .run_attempt][0] // empty')"
            fi
            if [[ -z "$BLOCKED_RUN_ID" || -z "$BLOCKED_CREATED_AT" ]]; then
              echo "::error::Could not identify the exact blocked Setup A run; manual recovery cannot be applied."
              exit 1
            fi
            RECOVERY_RUN_IDS_TEXT="$(printf '%s' "$RUNS_JSON" | jq -r \
              --arg recovery_workflow "$RECOVERY_WORKFLOW_PATH" \
              --arg branch "$GITHUB_REF_NAME" \
              --arg blocked_at "$BLOCKED_CREATED_AT" '
                [.[].workflow_runs[]?
                 | select(.head_branch == $branch)
                 | select(.event == "workflow_dispatch")
                 | select(.status == "completed" and .conclusion == "success")
                 | select(((.path // "") | split("@")[0]) == $recovery_workflow)
                 | select(.created_at > $blocked_at)]
                | sort_by(.created_at, .id)
                | reverse
                | .[].id
              ')"
            RECOVERY_SELECTED="false"
            if [[ -n "$RECOVERY_RUN_IDS_TEXT" ]]; then
              while IFS= read -r RECOVERY_RUN_ID; do
                [[ -n "$RECOVERY_RUN_ID" ]] || continue
                RECOVERY_ARTIFACTS="$(gh_retry api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/artifacts?per_page=100")"
                RECOVERY_ATTEMPT="$(printf '%s' "$RUNS_JSON" | jq -r --arg id "$RECOVERY_RUN_ID" '[.[].workflow_runs[]? | select((.id | tostring) == $id) | .run_attempt][0] // empty')"
                RECOVERY_ARTIFACT_NAME="xaut-manual-recovery-approved-a${RECOVERY_ATTEMPT}"
                if printf '%s' "$RECOVERY_ARTIFACTS" | jq -e --arg run "$RECOVERY_RUN_ID" --arg name "$RECOVERY_ARTIFACT_NAME" '
                  any(.artifacts[]?;
                    .name == $name and
                    .expired == false and
                    (.workflow_run.id | tostring) == $run
                  )
                ' >/dev/null; then
                  PREVIOUS_RUN_ID="$RECOVERY_RUN_ID"
                  PREVIOUS_ARTIFACT_NAME="$RECOVERY_ARTIFACT_NAME"
                  MANUAL_RECOVERY="true"
                  RECOVERY_SELECTED="true"
                  echo "Found a recent manual-recovery approval artifact in run ${RECOVERY_RUN_ID}."
                  break
                fi
              done <<< "$RECOVERY_RUN_IDS_TEXT"
            fi
            if [[ "$RECOVERY_SELECTED" != "true" ]]; then
              echo "::error::Paper checkpoint recovery is blocked for Setup A run ${BLOCKED_RUN_ID}."
              echo "::error::Run Manual Recovery for this branch, select an older valid Setup A checkpoint, then retry Setup A."
              exit 1
            fi
          fi

          if [[ -n "$PREVIOUS_RUN_ID" ]]; then
            RESTORE_DIR="$RUNNER_TEMP/xaut-paper-state-restore"
            echo "Downloading Paper state artifact from run ${PREVIOUS_RUN_ID}."
            download_artifact_with_retry "$PREVIOUS_RUN_ID" "$PREVIOUS_ARTIFACT_NAME" "$RESTORE_DIR"

            RESTORE_RUN_ID="$PREVIOUS_RUN_ID"
            RESTORE_ARTIFACT_NAME="$PREVIOUS_ARTIFACT_NAME"

            if [[ "$MANUAL_RECOVERY" == "true" ]]; then
              export RECOVERY_DIR="$RESTORE_DIR"
              export RECOVERY_RUN_ID="$PREVIOUS_RUN_ID"
              export BLOCKED_RUN_ID
              export BLOCKED_RUN_ATTEMPT
              export EXPECTED_REPOSITORY="$GITHUB_REPOSITORY"
              export EXPECTED_BRANCH="$GITHUB_REF_NAME"
              export EXPECTED_ARTIFACT_NAME="$PREVIOUS_ARTIFACT_NAME"
              RECOVERY_RUN_META="$RUNNER_TEMP/xaut-manual-recovery-run.json"
              export RECOVERY_RUN_META RUNNER_TEMP
              SOURCE_RUN_META="$RUNNER_TEMP/xaut-manual-recovery-source-run.json"
              SOURCE_ARTIFACT_META="$RUNNER_TEMP/xaut-manual-recovery-source-artifacts.json"
              RECOVERY_ATTEMPT="$(printf '%s' "$PREVIOUS_ARTIFACT_NAME" | sed -nE 's/^xaut-manual-recovery-approved-a([0-9]+)$/\1/p')"
              [[ "$RECOVERY_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Manual-recovery artifact attempt suffix is invalid."; exit 1; }
              gh_retry api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_RUN_ID}/attempts/${RECOVERY_ATTEMPT}" > "$RECOVERY_RUN_META"
              APPROVAL_SOURCE_RUN_ID="$(jq -r '.source_run_id' "$RESTORE_DIR/manual_recovery_approval.json")"
              APPROVAL_SOURCE_ATTEMPT="$(jq -r '.source_run_attempt' "$RESTORE_DIR/manual_recovery_approval.json")"
              [[ "$APPROVAL_SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Approved source attempt is invalid."; exit 1; }
              gh_retry api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVAL_SOURCE_RUN_ID}/attempts/${APPROVAL_SOURCE_ATTEMPT}" > "$SOURCE_RUN_META"
              gh_retry api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVAL_SOURCE_RUN_ID}/artifacts?per_page=100" > "$SOURCE_ARTIFACT_META"
              export SOURCE_RUN_META SOURCE_ARTIFACT_META

              python - <<'PY'
          import json
          import os
          from pathlib import Path

          def fail(message):
              raise SystemExit(f"MANUAL RECOVERY APPROVAL REJECTED: {message}")

          recovery_meta = json.loads(Path(os.environ["RECOVERY_RUN_META"]).read_text(encoding="utf-8"))
          source_run_id = recovery_meta.get("id")
          if str(source_run_id) != os.environ["RECOVERY_RUN_ID"]:
              fail("recovery workflow run ID mismatch")
          if recovery_meta.get("repository", {}).get("full_name") != os.environ["EXPECTED_REPOSITORY"]:
              fail("recovery workflow repository mismatch")
          if recovery_meta.get("head_branch") != os.environ["EXPECTED_BRANCH"]:
              fail("recovery workflow branch mismatch")
          if recovery_meta.get("event") != "workflow_dispatch" or recovery_meta.get("status") != "completed" or recovery_meta.get("conclusion") != "success":
              fail("recovery workflow did not complete successfully")
          if (recovery_meta.get("path", "").split("@")[0] != ".github/workflows/manual-recovery.yml"):
              fail("artifact was not created by the approved manual-recovery workflow")

          base = Path(os.environ["RECOVERY_DIR"])
          approval_path = base / "manual_recovery_approval.json"
          if approval_path.is_symlink() or not approval_path.is_file():
              fail("manual_recovery_approval.json is missing or not a regular file")
          approval = json.loads(approval_path.read_text(encoding="utf-8"))
          if approval.get("schema_version") != 1 or approval.get("approved") is not True:
              fail("approval schema/flag is invalid")
          if approval.get("mode") != "PAPER" or approval.get("symbol") != "XAUTUSD" or int(approval.get("product_id", -1)) != 131253:
              fail("approval is not for XAUTUSD Paper mode")
          if approval.get("repository") != os.environ["EXPECTED_REPOSITORY"] or approval.get("target_branch") != os.environ["EXPECTED_BRANCH"]:
              fail("approval repository/branch mismatch")
          if str(approval.get("recovery_run_id", "")) != os.environ["RECOVERY_RUN_ID"]:
              fail("approval does not belong to this recovery workflow run")
          if str(approval.get("recovery_run_attempt", "")) != str(recovery_meta.get("run_attempt", "")):
              fail("approval recovery attempt mismatch")
          if str(approval.get("blocked_run_id", "")) != os.environ["BLOCKED_RUN_ID"]:
              fail("approval is for a different blocked Setup A run")
          if str(approval.get("blocked_run_attempt", "")) != os.environ["BLOCKED_RUN_ATTEMPT"]:
              fail("approval is for a different blocked Setup A attempt")
          if approval.get("approved_by") != recovery_meta.get("actor", {}).get("login"):
              fail("approval actor does not match the GitHub workflow actor")
          if recovery_meta.get("created_at", "") <= str(approval.get("blocked_run_created_at", "")):
              fail("recovery approval was not created after the blocked run")

          source_run_id = str(approval.get("source_run_id", ""))
          source_attempt = str(approval.get("source_run_attempt", ""))
          source_artifact_name = str(approval.get("source_artifact_name", ""))
          if not source_run_id.isdigit() or not source_attempt.isdigit():
              fail("source run ID/attempt is malformed")
          if source_artifact_name != f"xaut-paper-state-a{source_attempt}":
              fail("source artifact name does not match source attempt")

          # The approval payload may contain only the original manifest and its declared files.
          manifest_path = base / "state_manifest.json"
          if manifest_path.is_symlink() or not manifest_path.is_file():
              fail("source state manifest is missing")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schema_version") != 1 or manifest.get("mode") != "PAPER":
              fail("source manifest schema/mode mismatch")
          if manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
              fail("source manifest symbol/product mismatch")
          source_run = manifest.get("run")
          if not isinstance(source_run, dict):
              fail("source manifest run metadata is missing")
          source_run_meta = json.loads(Path(os.environ["SOURCE_RUN_META"]).read_text(encoding="utf-8"))
          if str(source_run_meta.get("id", "")) != source_run_id:
              fail("source GitHub run ID mismatch")
          if source_run_meta.get("head_sha") != source_run.get("runner_commit_sha"):
              fail("source manifest runner commit does not match GitHub run metadata")
          if str(source_run.get("workflow_run_id", "")) != source_run_id or str(source_run.get("workflow_run_attempt", "")) != source_attempt:
              fail("source manifest run/attempt mismatch")
          if source_run.get("repository") != os.environ["EXPECTED_REPOSITORY"] or source_run.get("ref_name") != os.environ["EXPECTED_BRANCH"]:
              fail("source manifest repository/branch mismatch")

          manifest_files = manifest.get("files")
          approval_files = approval.get("files")
          allowed = {"paper_state.json", "alert_state.json", "trade_history.csv", "trade_history_legacy.csv", "execution_journal.json"}
          if not isinstance(manifest_files, dict) or "paper_state.json" not in manifest_files:
              fail("source manifest does not list paper_state.json")
          if not set(manifest_files).issubset(allowed):
              fail("source manifest lists unexpected files")
          if not isinstance(approval_files, dict):
              fail("approval file hash map is malformed")
          expected_names = set(manifest_files) | {"state_manifest.json"}
          if set(approval_files) != expected_names:
              fail("approval file set does not match source manifest")
          for entry in base.rglob("*"):
              if entry.is_symlink() or not entry.is_file() or entry.parent != base:
                  fail(f"unexpected nested/non-regular recovery artifact entry: {entry.relative_to(base)}")
          actual_names = {p.name for p in base.iterdir() if p.is_file()}
          if actual_names != expected_names | {"manual_recovery_approval.json"}:
              fail("recovery artifact contains unexpected/missing files")
          for name, record in approval_files.items():
              path = base / name
              if path.is_symlink() or not path.is_file():
                  fail(f"recovery file missing/not regular: {name}")
              import hashlib
              if not isinstance(record, dict) or record.get("sha256") != hashlib.sha256(path.read_bytes()).hexdigest() or int(record.get("size_bytes", -1)) != path.stat().st_size:
                  fail(f"approval hash/size mismatch: {name}")

          source_copy = Path(os.environ["RUNNER_TEMP"]) / "xaut-manual-recovery-source-checkpoint"
          if source_copy.exists():
              import shutil
              shutil.rmtree(source_copy)
          source_copy.mkdir(parents=True)
          for name in expected_names:
              import shutil
              shutil.copy2(base / name, source_copy / name)

          print("MANUAL RECOVERY APPROVAL VERIFIED FOR BLOCKED RUN:", os.environ["BLOCKED_RUN_ID"])
          print("RESTORE SOURCE:", source_run_id, "attempt", source_attempt)
          PY
              RESTORE_RUN_ID="$(jq -r '.source_run_id' "$RESTORE_DIR/manual_recovery_approval.json")"
              RESTORE_ARTIFACT_NAME="$(jq -r '.source_artifact_name' "$RESTORE_DIR/manual_recovery_approval.json")"
              RESTORE_DIR="$RUNNER_TEMP/xaut-manual-recovery-source-checkpoint"

              jq -e \
                --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
                --arg workflow "$WORKFLOW_PATH" --arg attempt "$(jq -r '.source_run_attempt' "$RUNNER_TEMP/xaut-paper-state-restore/manual_recovery_approval.json")" '
                  .repository.full_name == $repo and .head_branch == $branch and
                  .event == "workflow_dispatch" and .status == "completed" and
                  ((.path // "") | split("@")[0]) == $workflow and
                  (.run_attempt | tostring) == $attempt
                ' "$SOURCE_RUN_META" >/dev/null || { echo "::error::Approved source run metadata no longer matches."; exit 1; }
              jq -e \
                --arg run "$RESTORE_RUN_ID" \
                --arg state "$RESTORE_ARTIFACT_NAME" \
                --arg marker "xaut-run-started-a$(jq -r '.source_run_attempt' "$RUNNER_TEMP/xaut-paper-state-restore/manual_recovery_approval.json")" '
                  any(.artifacts[]?; .name == $state and .expired == false and (.workflow_run.id | tostring) == $run) and
                  any(.artifacts[]?; .name == $marker and .expired == false and (.workflow_run.id | tostring) == $run)
                ' "$SOURCE_ARTIFACT_META" >/dev/null || { echo "::error::Original source checkpoint/marker artifact is no longer available."; exit 1; }
              echo "Manual recovery approved by $(jq -r '.approved_by' "$RUNNER_TEMP/xaut-paper-state-restore/manual_recovery_approval.json")."
            fi

            export RESTORE_RUN_ID
            export RESTORE_ARTIFACT_NAME

            python - "$RESTORE_DIR" <<'PY'
          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import shutil
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          allowed = {
              "paper_state.json",
              "alert_state.json",
              "trade_history.csv",
              "trade_history_legacy.csv",
              "execution_journal.json",
          }
          required = "paper_state.json"

          def fail(message):
              raise SystemExit(f"STATE RESTORE VALIDATION FAILED: {message}")

          def read_json(name):
              path = source / name
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      value = json.load(handle)
              except Exception as error:
                  fail(f"cannot parse {name}: {error!r}")
              if not isinstance(value, dict):
                  fail(f"{name} root must be a JSON object")
              return value

          def validate_file(name):
              path = source / name
              if path.is_symlink() or not path.is_file():
                  fail(f"{name} is not a regular file")
              if name == "paper_state.json":
                  data = read_json(name)
                  if data.get("version") not in (1, 2):
                      fail("unsupported Paper state version")
                  if data.get("symbol") != "XAUTUSD" or int(data.get("product_id", -1)) != 131253:
                      fail("Paper state symbol/product mismatch")
                  state = data.get("state")
                  if not isinstance(state, dict):
                      fail("Paper state body is missing")
                  position = float(state.get("position"))
                  if not math.isfinite(position) or position not in (-1.0, 0.0, 1.0):
                      fail("Paper state position is invalid")
                  pending = state.get("pending_csv_trade")
                  if pending is not None and not isinstance(pending, dict):
                      fail("Paper CSV outbox is malformed")
              elif name == "alert_state.json":
                  data = read_json(name)
                  if data.get("version") != 1:
                      fail("unsupported alert-state version")
                  if not isinstance(data.get("active_incidents"), dict) or not isinstance(data.get("queue"), list):
                      fail("alert-state structure is invalid")
              elif name == "trade_history.csv":
                  with path.open("r", newline="", encoding="utf-8") as handle:
                      reader = csv.DictReader(handle)
                      expected = [
                          "symbol", "mode", "direction", "quantity", "entry_time_utc",
                          "exit_time_utc", "entry_price", "exit_price", "price_points",
                          "cumulative_points", "exit_reason",
                      ]
                      if reader.fieldnames != expected:
                          fail("trade-history CSV header mismatch")
                      for _ in reader:
                          pass
              elif name == "trade_history_legacy.csv":
                  with path.open("r", newline="", encoding="utf-8-sig") as handle:
                      reader = csv.reader(handle)
                      if not next(reader, None):
                          fail("legacy CSV has no header")
                      for _ in reader:
                          pass
              elif name == "execution_journal.json":
                  data = read_json(name)
                  if data.get("version") != 1 or data.get("symbol") != "XAUTUSD":
                      fail("execution-journal schema/symbol mismatch")
                  if int(data.get("product_id", -1)) != 131253:
                      fail("execution-journal product mismatch")
                  position = float(data.get("managed_position", 0))
                  if not math.isfinite(position) or position not in (-1.0, 0.0, 1.0):
                      fail("execution-journal managed position is invalid")
                  if data.get("pending_order") is not None and not isinstance(data.get("pending_order"), dict):
                      fail("execution-journal pending order is malformed")

          if not (source / required).is_file():
              fail("paper_state.json is missing")

          manifest_path = source / "state_manifest.json"
          if manifest_path.is_symlink():
              fail("state_manifest.json must not be a symlink")

          if manifest_path.is_file():
              manifest = read_json("state_manifest.json")
              if manifest.get("schema_version") != 1:
                  fail("unsupported checkpoint manifest schema")
              if manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
                  fail("checkpoint manifest symbol/product mismatch")
              if manifest.get("mode") != "PAPER":
                  fail("checkpoint manifest is not a Paper-mode checkpoint")

              # Bind a versioned checkpoint to the exact workflow run and
              # attempt that produced it; do not accept a swapped artifact.
              artifact_match = re.fullmatch(r"xaut-paper-state-a([0-9]+)", os.environ["RESTORE_ARTIFACT_NAME"])
              run_meta = manifest.get("run")
              if artifact_match:
                  if not isinstance(run_meta, dict):
                      fail("versioned checkpoint is missing workflow run metadata")
                  if str(run_meta.get("workflow_run_id", "")) != os.environ["RESTORE_RUN_ID"]:
                      fail("checkpoint manifest workflow run ID does not match artifact source")
                  if str(run_meta.get("workflow_run_attempt", "")) != artifact_match.group(1):
                      fail("checkpoint manifest attempt does not match artifact name")
              elif isinstance(run_meta, dict):
                  recorded_run_id = str(run_meta.get("workflow_run_id", ""))
                  if recorded_run_id and recorded_run_id != os.environ["RESTORE_RUN_ID"]:
                      fail("legacy checkpoint manifest run ID does not match artifact source")

              records = manifest.get("files")
              if not isinstance(records, dict) or required not in records:
                  fail("manifest does not list required paper_state.json")
              names = set(records)
              if not names.issubset(allowed):
                  fail(f"manifest contains unexpected files: {sorted(names - allowed)}")
              for name, record in records.items():
                  if not isinstance(record, dict):
                      fail(f"invalid manifest record for {name}")
                  validate_file(name)
                  path = source / name
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  if record.get("sha256") != digest:
                      fail(f"SHA-256 mismatch for {name}")
                  if int(record.get("size_bytes", -1)) != path.stat().st_size:
                      fail(f"size mismatch for {name}")
              file_names = sorted(names)
              print("CHECKPOINT MANIFEST VERIFIED:", ", ".join(file_names))
          else:
              # One-time migration path for older artifacts without a manifest.
              # Their files are structurally checked; the next run writes hashes.
              file_names = sorted(name for name in allowed if (source / name).exists())
              validate_file(required)
              for name in file_names:
                  validate_file(name)
              print("LEGACY PAPER STATE ARTIFACT STRUCTURALLY VERIFIED; checksum manifest will be added on this run.")

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          for name in file_names:
              shutil.copy2(source / name, workspace / name)
          if manifest_path.is_file():
              shutil.copy2(manifest_path, workspace / "state_manifest.json")
          print("PAPER STATE RESTORED AND VALIDATED FROM RUN ARTIFACT.")
          PY

          elif [[ -n "$LEGACY_RUN_ID" ]]; then
            LEGACY_DIR="$RUNNER_TEMP/xaut-legacy-paper-history"
            echo "No state checkpoint exists; preserving legacy CSV from run ${LEGACY_RUN_ID}."
            download_artifact_with_retry "$LEGACY_RUN_ID" "xaut-paper-trade-history" "$LEGACY_DIR"
            LEGACY_CSV="$(find "$LEGACY_DIR" -type f -name trade_history.csv -print -quit)"
            if [[ -z "$LEGACY_CSV" || ! -s "$LEGACY_CSV" ]]; then
              echo "::error::Legacy trade-history artifact is missing or empty."
              exit 1
            fi
            cp "$LEGACY_CSV" trade_history_legacy.csv
            echo "Legacy history preserved separately. New Paper state will be initialized flat."

          elif [[ "${#PREVIOUS_RUN_IDS[@]}" -eq 0 ]]; then
            echo "No previous completed Setup A run on this branch. Starting the first Paper state."

          else
            echo "No valid Paper checkpoint was found in previous runs."
            echo "::error::Refusing to create a new flat state because prior history exists but no verified checkpoint is available."
            exit 1
          fi

      - name: Invalidate restored manifest before this run
        timeout-minutes: 2
        run: rm -f state_manifest.json state_manifest.json.tmp

      - name: Verify required API secrets are present
        timeout-minutes: 2
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY:-}" || -z "${API_SECRET:-}" ]]; then
            echo "::error::API_KEY or API_SECRET repository secret is missing."
            exit 1
          fi
          echo "Required Delta API secrets are present (values not displayed)."

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --retries 5 --timeout 30
          python -m pip install --retries 5 --timeout 30 -r private-bot/requirements.txt
          python -m pip check

      - name: Record bot source revision
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          BOT_SHA="$(git -C private-bot rev-parse HEAD)"
          echo "BOT_COMMIT_SHA=${BOT_SHA}" >> "$GITHUB_ENV"
          {
            echo "### Bot source"
            echo "Private bot commit: \`${BOT_SHA}\`"
            echo "Runner workflow commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect runner public IP
        id: runner_ip
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          IP=""
          for attempt in 1 2 3 4 5; do
            if IP="$(curl -4 -fsS --connect-timeout 10 --max-time 20 \
              --retry 2 --retry-all-errors --retry-delay 2 https://api.ipify.org)" \
              && [[ "$IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
              break
            fi
            echo "Public-IP lookup failed (attempt ${attempt}/5); retrying."
            IP=""
            sleep 3
          done
          if [[ -z "$IP" ]]; then
            echo "::error::Could not detect a valid runner public IPv4 address."
            exit 1
          fi
          echo "Runner public IP: ${IP}"
          echo "ip=${IP}" >> "$GITHUB_OUTPUT"
          echo "Delta API whitelist must include this temporary runner IP: ${IP}" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Delta IP whitelist
        timeout-minutes: 3
        run: |
          echo "Add the runner IP shown above to the Delta Exchange API whitelist."
          echo "Waiting 90 seconds before the read-only Paper Mode bot starts."
          sleep 90

      - name: Prepare bot-start marker
        id: prepare_run_marker
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          payload = {
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "workflow_commit": os.environ.get("GITHUB_SHA", ""),
              "bot_commit": os.environ.get("BOT_COMMIT_SHA", ""),
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "xaut-run-started.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, separators=(",", ":"))
          print("Run-start marker prepared. No API secret is written to it.")
          PY

      - name: Upload bot-start marker
        id: upload_run_marker
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: xaut-run-started-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/xaut-run-started.json
          if-no-files-found: error
          retention-days: 30

      - name: Run bot in Paper Mode
        id: run_bot
        if: steps.upload_run_marker.outcome == 'success'
        # The job-level 360-minute limit should end the run before this step.
        timeout-minutes: 360
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: "false"
          # Intentionally longer than the GitHub job limit for forced-stop testing.
          BOT_RUNTIME_MINUTES: "400"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM || secrets.SMTP_USER }}
        run: python -u private-bot/bot.py

      - name: Validate and prepare state checkpoint
        id: checkpoint
        if: always() && steps.upload_run_marker.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import os
          import shutil
          from pathlib import Path

          allowed = {
              "paper_state.json",
              "alert_state.json",
              "trade_history.csv",
              "trade_history_legacy.csv",
              "execution_journal.json",
          }
          state_dir = Path("state-artifact")
          if state_dir.exists():
              shutil.rmtree(state_dir)
          state_dir.mkdir(parents=True)

          def fail(message):
              raise SystemExit(f"CHECKPOINT VALIDATION FAILED: {message}")

          manifest_path = Path("state_manifest.json")
          if manifest_path.is_symlink() or not manifest_path.is_file():
              fail("bot did not create a regular new state_manifest.json; no artifact will be uploaded")
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception as error:
              fail(f"manifest cannot be parsed: {error!r}")

          if not isinstance(manifest, dict):
              fail("manifest root must be a JSON object")
          if manifest.get("schema_version") != 1:
              fail("unsupported manifest schema")
          if manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
              fail("manifest symbol/product mismatch")
          if manifest.get("mode") != "PAPER":
              fail("workflow is Paper-only but bot manifest is not PAPER")
          run = manifest.get("run")
          if not isinstance(run, dict):
              fail("manifest run metadata is missing or malformed")
          if str(run.get("workflow_run_id", "")) != os.environ.get("GITHUB_RUN_ID", ""):
              fail("manifest belongs to a different GitHub workflow run")
          if str(run.get("workflow_run_attempt", "")) != os.environ.get("GITHUB_RUN_ATTEMPT", ""):
              fail("manifest belongs to a different workflow attempt")
          records = manifest.get("files")
          if not isinstance(records, dict) or "paper_state.json" not in records:
              fail("manifest is missing required paper_state.json")
          names = set(records)
          if not names.issubset(allowed):
              fail(f"manifest contains unexpected file names: {sorted(names - allowed)}")

          for temp_name in [name + ".tmp" for name in allowed] + ["state_manifest.json.tmp"]:
              if Path(temp_name).exists():
                  fail(f"unfinished atomic-write temporary file exists: {temp_name}")

          for name, record in records.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  fail(f"checkpoint file is missing/not regular: {name}")
              if not isinstance(record, dict):
                  fail(f"manifest record is malformed: {name}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != record.get("sha256"):
                  fail(f"SHA-256 mismatch: {name}")
              if path.stat().st_size != int(record.get("size_bytes", -1)):
                  fail(f"file-size mismatch: {name}")

          paper = json.loads(Path("paper_state.json").read_text(encoding="utf-8"))
          if not isinstance(paper, dict) or paper.get("version") not in (1, 2) or paper.get("symbol") != "XAUTUSD":
              fail("Paper state version/symbol is invalid")
          if int(paper.get("product_id", -1)) != 131253 or not isinstance(paper.get("state"), dict):
              fail("Paper state product/body is invalid")
          position = float(paper["state"].get("position"))
          if not math.isfinite(position) or position not in (-1.0, 0.0, 1.0):
              fail("Paper position is invalid")
          if paper["state"].get("pending_csv_trade") is not None:
              fail("Paper CSV outbox remains unresolved")

          if "alert_state.json" in records:
              alert = json.loads(Path("alert_state.json").read_text(encoding="utf-8"))
              if not isinstance(alert, dict) or alert.get("version") != 1 or not isinstance(alert.get("active_incidents"), dict) or not isinstance(alert.get("queue"), list):
                  fail("alert state is invalid")
          if "trade_history.csv" in records:
              with open("trade_history.csv", "r", newline="", encoding="utf-8") as handle:
                  reader = csv.DictReader(handle)
                  if reader.fieldnames != [
                      "symbol", "mode", "direction", "quantity", "entry_time_utc",
                      "exit_time_utc", "entry_price", "exit_price", "price_points",
                      "cumulative_points", "exit_reason",
                  ]:
                      fail("trade-history CSV header mismatch")
                  for _ in reader:
                      pass
          if "trade_history_legacy.csv" in records:
              with open("trade_history_legacy.csv", "r", newline="", encoding="utf-8-sig") as handle:
                  reader = csv.reader(handle)
                  if not next(reader, None):
                      fail("legacy trade-history CSV has no header")
                  for _ in reader:
                      pass
          if "execution_journal.json" in records:
              journal = json.loads(Path("execution_journal.json").read_text(encoding="utf-8"))
              if not isinstance(journal, dict) or journal.get("version") != 1 or journal.get("symbol") != "XAUTUSD":
                  fail("execution journal schema/symbol is invalid")
              if int(journal.get("product_id", -1)) != 131253:
                  fail("execution journal product ID is invalid")
              managed_position = float(journal.get("managed_position", 0))
              if not math.isfinite(managed_position) or managed_position not in (-1.0, 0.0, 1.0):
                  fail("execution journal managed position is invalid")
              if journal.get("pending_order") is not None and not isinstance(journal.get("pending_order"), dict):
                  fail("execution journal pending order is malformed")

          for name in sorted(names):
              shutil.copy2(name, state_dir / name)
          shutil.copy2(manifest_path, state_dir / "state_manifest.json")
          print("Verified checkpoint ready for upload:", ", ".join(sorted(names)))
          PY

      - name: Upload verified Paper state
        id: upload_checkpoint
        if: always() && steps.checkpoint.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: xaut-paper-state-a${{ github.run_attempt }}
          path: state-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded checkpoint is visible
        if: always() && steps.upload_checkpoint.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload_checkpoint.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: xaut-paper-state-a${{ github.run_attempt }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.upload_checkpoint.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED="false"
          for attempt in 1 2 3 4 5; do
            if ARTIFACTS_JSON="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" 2>/dev/null)"; then
              if printf '%s' "$ARTIFACTS_JSON" | jq -e \
                --arg id "$EXPECTED_ARTIFACT_ID" \
                --arg name "$EXPECTED_ARTIFACT_NAME" '
                  any(.artifacts[]?;
                    (.id | tostring) == $id and
                    .name == $name and
                    .expired == false
                  )
                ' >/dev/null; then
                VERIFIED="true"
                break
              fi
            fi
            echo "Artifact not yet visible through the Actions API (attempt ${attempt}/5)."
            sleep $((attempt * 2))
          done

          if [[ "$VERIFIED" != "true" ]]; then
            echo "::error::Upload action succeeded but the checkpoint artifact could not be verified through the Actions API."
            exit 1
          fi

          {
            echo "### Paper checkpoint verification"
            echo "Artifact name: \`${EXPECTED_ARTIFACT_NAME}\`"
            echo "Artifact ID: \`${EXPECTED_ARTIFACT_ID}\`"
            echo "Artifact SHA-256: \`${EXPECTED_ARTIFACT_DIGEST}\`"
            echo "Artifact confirmed visible and unexpired through the Actions API."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verified uploaded checkpoint artifact: ${EXPECTED_ARTIFACT_NAME} (ID ${EXPECTED_ARTIFACT_ID})."
