name: Run XAUT Bot

on:
  workflow_dispatch:
    inputs:
      enable_live_trading:
        description: "Enable REAL trading (use demo first)"
        required: true
        type: boolean
        default: false
      runtime_minutes:
        description: "Bot runtime in minutes (use 5 for a short test; default is 350)"
        required: true
        type: choice
        options:
          - "5"
          - "10"
          - "30"
          - "60"
          - "120"
          - "350"
        default: "350"

# The public runner needs read-only access to its own source repository.
# Private xaut-bot access is provided only by the fine-grained BOT_REPO_TOKEN.
permissions:
  contents: read

concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private bot
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          ref: ai-managed-trading-v1
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Verify and stage private recovery state
        env:
          GH_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_REPO="mishraarvind463-del/xaut-bot"
          PRIVATE_BRANCH="xaut-recovery-state"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo "Checking access to private recovery repository and branch."
          gh api "repos/${PRIVATE_REPO}/branches/${PRIVATE_BRANCH}" >/dev/null

          fetch_private_file() {
            local remote_path="$1"
            local local_path="$2"
            gh api "repos/${PRIVATE_REPO}/contents/${remote_path}?ref=${PRIVATE_BRANCH}" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$local_path"
            test -s "$local_path"
          }

          fetch_private_file "runtime-state/PRIVATE_STORAGE_MIGRATION.json" "$TMP_DIR/manifest.json"
          fetch_private_file "runtime-state/bot_recovery_state.json" "$TMP_DIR/bot_recovery_state.json"
          fetch_private_file "runtime-state/trade_history.csv" "$TMP_DIR/trade_history.csv"
          fetch_private_file "runtime-state/ai_memory.json" "$TMP_DIR/ai_memory.json"
          fetch_private_file "runtime-state/shadow_trade_journal.jsonl.gz" "$TMP_DIR/shadow_trade_journal.jsonl.gz"

          python - "$TMP_DIR" <<'PY'
          import csv
          import gzip
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected_manifest = {
              "source_repository": "mishraarvind463-del/xaut-runner",
              "source_branch": "xaut-recovery-state",
              "destination_repository": "mishraarvind463-del/xaut-bot",
              "destination_branch": "xaut-recovery-state",
          }
          if manifest.get("migration_complete") is not True:
              raise SystemExit("Private recovery manifest is not marked complete.")
          for key, expected in expected_manifest.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f"Private recovery manifest mismatch: {key}")

          recovery = json.loads((root / "bot_recovery_state.json").read_text(encoding="utf-8"))
          if not isinstance(recovery, dict) or recovery.get("product_id") != 131253:
              raise SystemExit("Private recovery state is not a valid XAUTUSD state object.")

          memory_path = root / "ai_memory.json"
          memory = json.loads(memory_path.read_text(encoding="utf-8"))
          if not isinstance(memory, dict) or memory.get("schema_version") not in (1, 2, 3) or memory.get("symbol") != "XAUTUSD":
              raise SystemExit("Private AI memory is not a supported XAUTUSD memory object.")
          model = memory.get("model")
          if not isinstance(model, dict) or not isinstance(model.get("weights"), dict):
              raise SystemExit("Private AI memory model/weights are missing.")
          if not isinstance(memory.get("evaluations"), list) or not isinstance(memory.get("outcomes"), list):
              raise SystemExit("Private AI memory evaluation/outcome arrays are invalid.")
          if memory.get("schema_version") == 3 and not isinstance(memory.get("counterfactual_outcomes"), list):
              raise SystemExit("Private AI memory counterfactual outcome array is invalid.")
          required_weights = {"ema_alignment", "momentum", "ema_spread", "candle_strength", "trend_efficiency"}
          if memory.get("schema_version") in (2, 3):
              required_weights.update({"multi_timeframe_alignment", "volume_confirmation"})
          if not required_weights.issubset(model["weights"]):
              raise SystemExit("Private AI memory is missing required model weights.")
          samples = model.get("samples", 0)
          wins = model.get("wins", 0)
          losses = model.get("losses", 0)
          if any(isinstance(v, bool) or not isinstance(v, int) or v < 0 for v in (samples, wins, losses)):
              raise SystemExit("Private AI memory sample counters are invalid.")
          if samples != wins + losses:
              raise SystemExit("Private AI memory sample counters do not reconcile.")

          with (root / "trade_history.csv").open("r", newline="", encoding="utf-8") as stream:
              reader = csv.DictReader(stream)
              required_columns = {"symbol", "mode", "direction", "quantity", "entry_time_utc", "exit_time_utc", "net_pnl"}
              if not reader.fieldnames or not required_columns.issubset(set(reader.fieldnames)):
                  raise SystemExit("Private trade history CSV is missing required columns.")
              rows = sum(1 for _ in reader)
              if rows < 1:
                  raise SystemExit("Private trade history CSV has no historical rows.")

          journal_bytes = gzip.decompress((root / "shadow_trade_journal.jsonl.gz").read_bytes())
          for line_number, line in enumerate(journal_bytes.splitlines(), 1):
              if not line.strip():
                  continue
              event = json.loads(line.decode("utf-8"))
              if not isinstance(event, dict) or not isinstance(event.get("event_type"), str):
                  raise SystemExit(f"Shadow journal event {line_number} is invalid.")

          print("PASS: private recovery manifest and all state files validated.")
          print("PASS: private AI memory validated; trade-history rows:", rows)
          print("PASS: shadow journal gzip validated; event rows:", sum(1 for x in journal_bytes.splitlines() if x.strip()))
          PY

          # Stage the verified private-branch AI memory into this ephemeral runner
          # workspace so a stale file on xaut-bot/main cannot outrank migrated memory.
          cp "$TMP_DIR/ai_memory.json" private-bot/ai_memory.json
          echo "Verified private AI memory staged in runner workspace."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websocket-client

      - name: Show GitHub Runner Public IP
        run: |
          echo "=================================="
          echo "GITHUB RUNNER PUBLIC IPv4 ADDRESS"
          echo "=================================="
          IP=$(curl -4 -sS https://api.ipify.org)
          echo "YOUR IP ADDRESS: $IP"
          echo "=================================="
          echo "COPY THIS IP AND ADD IT TO DELTA"

      - name: Wait for Delta IP Whitelisting
        run: |
          echo "You have 90 seconds to add this IP to Delta."
          sleep 90
          echo "Waiting period completed."
          echo "Starting bot now."

      - name: Run XAUT Bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          # The fine-grained token is scoped only to private xaut-bot.
          GITHUB_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
          RECOVERY_STATE_REPOSITORY: mishraarvind463-del/xaut-bot
          RECOVERY_STATE_BRANCH: "xaut-recovery-state"
          REMOTE_RECOVERY_REQUIRED: "true"
          BOT_WATCHDOG_TIMEOUT_SECONDS: "180"
          ENABLE_LIVE_TRADING: ${{ inputs.enable_live_trading && 'true' || 'false' }}
          BOT_RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        working-directory: private-bot
        run: python -u bot.py
