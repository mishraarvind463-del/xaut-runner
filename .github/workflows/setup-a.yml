name: Setup A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private bot
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r private-bot/requirements.txt

      - name: Check bot syntax
        run: python -m py_compile private-bot/bot.py
