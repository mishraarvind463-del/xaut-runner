name: Refresh XAUT Runner Project Status

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".project-context/RUNNER_STATUS.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-xaut-runner-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-runner-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh runner status metadata
        env:
          GH_EVENT_PATH: ${{ github.event_path }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GH_EVENT_PATH"]).read_text(encoding="utf-8"))
          head = event.get("head_commit") or {}
          base = event.get("before") or ""
          head_sha = os.environ["HEAD_SHA"]
          if base and set(base) != {"0"}:
              result = subprocess.run(
                  ["git", "diff", "--name-status", base, head_sha],
                  check=True, capture_output=True, text=True,
              )
              changed = [line for line in result.stdout.splitlines() if line]
          else:
              result = subprocess.run(
                  ["git", "show", "--format=", "--name-status", "--no-renames", "HEAD"],
                  check=True, capture_output=True, text=True,
              )
              changed = [line for line in result.stdout.splitlines() if line]

          paths = [line.split("\t")[-1] for line in changed]
          config_paths = [
              path for path in paths
              if not path.startswith(".project-context/")
              and path != ".github/workflows/update-runner-project-status.yml"
          ]
          message = (head.get("message") or subprocess.check_output(
              ["git", "log", "-1", "--pretty=%s"], text=True
          ).strip()).splitlines()[0]
          timestamp = head.get("timestamp") or "not supplied by event"
          author = (head.get("author") or {}).get("username") or (head.get("author") or {}).get("name") or "unknown"
          changed_text = "\n".join(f"- `{line}`" for line in changed) or "- (no changed paths returned)"
          review_text = (
              "**REQUIRED — runner source/config/workflow changed.** Review the diff and confirm the private bot ref, paper default, IP-whitelist wait and secrets usage."
              if config_paths else
              "No runner config/source paths were detected in this push."
          )
          content = f"""# XAUT Runner — Current Status

          > Automatically refreshed after pushes to `main`. This is commit metadata, not a security or workflow validation result.

          - Update timestamp (UTC): {timestamp}
          - Branch: `{os.environ['REF_NAME']}`
          - Commit: `{head_sha}`
          - Commit message: {message}
          - Commit author: {author}
          - Context review: {review_text}
          - Triggering workflow: {os.environ['RUN_URL']}

          ## Changed paths
          {changed_text}

          ## Required before changing runner behaviour
          1. Review `.github/workflows/setup-a.yml` and the exact diff.
          2. Confirm private checkout stays on `ai-managed-trading-v1` unless the user approves otherwise.
          3. Keep live trading default false and preserve manual dispatch / IP whitelist safeguards unless explicitly approved.
          4. Do not start the Delta-connected trading workflow as part of documentation maintenance.
          """
          Path(".project-context/RUNNER_STATUS.md").write_text(content, encoding="utf-8")
          PY

      - name: Commit runner status refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .project-context/RUNNER_STATUS.md
          if git diff --cached --quiet; then
            echo "Runner status is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh runner project status [skip ci]"
          git push
