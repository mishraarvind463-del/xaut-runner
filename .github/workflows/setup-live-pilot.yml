name: Setup Live Pilot
run-name: Setup Live Pilot - XAUTUSD 1 lot

on:
  workflow_dispatch:
    inputs:
      enable_live_trading:
        description: "Required: explicitly enable the supervised 1-lot Live pilot"
        required: true
        type: boolean
        default: false
      strategy_confirmation:
        description: "Type the exact settings shown by the bot, e.g. ATR=2;MULTIPLIER=1.0"
        required: true
        type: string
      risk_acknowledgement:
        description: "Type I_ACCEPT_NO_STOP_LOSS_AND_1_LOT_CAP"
        required: true
        type: string
      manual_recovery_after_flat:
        description: "Only after an interrupted Live run AND you have manually verified/closed any position on Delta"
        required: true
        type: boolean
        default: false
      blocked_run_id:
        description: "Required only for manual recovery: exact interrupted Setup Live Pilot run ID"
        required: false
        type: string
        default: ""
      manual_recovery_confirmation:
        description: "Type RECOVER_XAUTUSD_LIVE_AFTER_MANUAL_FLAT only for a manually flattened interrupted run"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

# Share the same lock as Paper Setup A; never run both on the same account at once.
concurrency:
  group: xaut-trading-bot
  cancel-in-progress: false

jobs:
  live-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require explicit Live and risk approvals
        shell: bash
        env:
          ENABLE_INPUT: ${{ inputs.enable_live_trading }}
          STRATEGY_CONFIRMATION: ${{ inputs.strategy_confirmation }}
          RISK_ACKNOWLEDGEMENT: ${{ inputs.risk_acknowledgement }}
        run: |
          set -euo pipefail
          [[ "$ENABLE_INPUT" == "true" ]] || { echo "::error::Live was not explicitly enabled."; exit 1; }
          [[ "$RISK_ACKNOWLEDGEMENT" == "I_ACCEPT_NO_STOP_LOSS_AND_1_LOT_CAP" ]] || {
            echo "::error::Exact no-stop-loss/one-lot risk acknowledgement is required."; exit 1;
          }
          [[ -n "$STRATEGY_CONFIRMATION" ]] || { echo "::error::Exact strategy settings confirmation is required."; exit 1; }
          echo "Explicit Live and risk acknowledgements received; values are not echoed."

      - name: Checkout runner repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private bot
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        timeout-minutes: 10
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --retries 5 --timeout 30
          python -m pip install --retries 5 --timeout 30 -r private-bot/requirements.txt
          python -m pip check

      - name: Verify bot configuration and Live confirmation secret
        timeout-minutes: 2
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: "true"
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          APPROVED_STRATEGY: ${{ inputs.strategy_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          p = Path("private-bot/bot.py")
          spec = importlib.util.spec_from_file_location("xaut_live_preflight", p)
          if spec is None or spec.loader is None:
              raise SystemExit("Cannot load private-bot/bot.py")
          bot = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bot)
          if not os.environ.get("API_KEY") or not os.environ.get("API_SECRET"):
              raise SystemExit("API_KEY/API_SECRET secret is missing")
          if bot.LIVE_TRADING is not True or bot.PAPER_MODE is not False:
              raise SystemExit("Live confirmation secret is missing/incorrect; no bot run started")
          expected = f"ATR={bot.ATR_PERIOD};MULTIPLIER={bot.MULTIPLIER}"
          if os.environ.get("APPROVED_STRATEGY", "") != expected:
              raise SystemExit(f"Strategy confirmation mismatch. Exact value required: {expected}")
          if (bot.SYMBOL, bot.PRODUCT_ID, bot.CANDLE_SYMBOL) != ("XAUTUSD", 131253, "MARK:XAUTUSD"):
              raise SystemExit("Symbol/product/Mark candle identity mismatch")
          if bot.LOT_SIZE != 1 or bot.MAX_LOTS != 1:
              raise SystemExit("Live pilot requires LOT_SIZE=1 and MAX_LOTS=1")
          if bot.CANDLE_CLOSE_DELAY != 3 or bot.BOT_RUNTIME_MINUTES <= 0:
              raise SystemExit("1-minute strategy close-delay/runtime configuration invalid")
          if bot.RUN_ONCE:
              raise SystemExit("RUN_ONCE must be false for the supervised pilot")
          bot.validate_configuration()
          print("LIVE CONFIGURATION VERIFIED:", expected, "| LOT_SIZE=1 | MAX_LOTS=1 | CLOSE_DELAY=3s")
          PY

      - name: Run offline regression and execution-safety suites
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_pre_live_suite.py private-bot/bot.py
          python tests/test_forced_interruption_simulation.py private-bot/bot.py
          python tests/test_live_mock_suite.py private-bot/bot.py

      - name: Record source revisions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          BOT_SHA="$(git -C private-bot rev-parse HEAD)"
          echo "BOT_COMMIT_SHA=${BOT_SHA}" >> "$GITHUB_ENV"
          {
            echo "### Live pilot source"
            echo "Private bot commit: \`${BOT_SHA}\`."
            echo "Runner workflow commit: \`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect runner public IP
        id: runner_ip
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          IP=""
          for attempt in 1 2 3 4 5; do
            if IP="$(curl -4 -fsS --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors --retry-delay 2 https://api.ipify.org)" \
              && [[ "$IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then break; fi
            IP=""; sleep 3
          done
          [[ -n "$IP" ]] || { echo "::error::Could not detect runner IPv4."; exit 1; }
          echo "Runner public IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Whitelist this temporary IP in Delta API Management: $IP" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Delta whitelist
        timeout-minutes: 3
        run: |
          echo "Add the runner IP above to the Delta API key whitelist."
          echo "Waiting 90 seconds before the Live preflight/API reads."
          sleep 90

      - name: Restore previous verified Live state or initialize from flat account
        id: restore_live
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: "true"
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          MANUAL_RECOVERY: ${{ inputs.manual_recovery_after_flat }}
          BLOCKED_RUN_ID_INPUT: ${{ inputs.blocked_run_id }}
          MANUAL_RECOVERY_CONFIRMATION: ${{ inputs.manual_recovery_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, os, shutil, subprocess
          from pathlib import Path

          def fail(message):
              raise SystemExit("LIVE RESTORE BLOCKED: " + message)

          spec = importlib.util.spec_from_file_location("xaut_live_restore_bot", "private-bot/bot.py")
          if spec is None or spec.loader is None:
              fail("cannot load private bot")
          bot = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bot)
          if bot.LIVE_TRADING is not True or bot.PAPER_MODE is not False:
              fail("Live confirmation is not valid")
          bot.validate_configuration()

          def gh_json(*args):
              raw = subprocess.check_output(["gh", *args], text=True)
              return json.loads(raw)

          runs = gh_json("api", "-X", "GET",
                         f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/setup-live-pilot.yml/runs",
                         "-f", f"branch={os.environ['GITHUB_REF_NAME']}",
                         "-f", "event=workflow_dispatch", "-F", "per_page=100")
          candidates = [r for r in runs.get("workflow_runs", [])
                        if str(r.get("id")) != os.environ["GITHUB_RUN_ID"]
                        and r.get("head_branch") == os.environ["GITHUB_REF_NAME"]]
          candidates.sort(key=lambda r: (r.get("created_at", ""), int(r.get("id", 0))), reverse=True)
          latest = candidates[0] if candidates else None

          def verify_live_account_flat():
              bot.validate_product_identity()
              pos = bot.read_stable_position()
              if pos is None or abs(float(pos)) > bot.POSITION_TOLERANCE:
                  fail(f"Delta XAUTUSD position is not verified flat (observed {pos}); manually flatten and inspect it")
              orders = bot.get_open_orders()
              if orders is None or orders:
                  fail("Delta XAUTUSD open-order list is not verified empty; inspect/cancel orders manually")
              print("LIVE ACCOUNT PREFLIGHT: XAUTUSD position is zero and no active XAUTUSD orders exist.")

          restore_dir = Path(os.environ["RUNNER_TEMP"]) / "xaut-live-restore"
          if restore_dir.exists():
              shutil.rmtree(restore_dir)
          restore_dir.mkdir(parents=True)

          if latest is None:
              print("No earlier Setup Live Pilot run exists; requiring a verified flat account for first initialization.")
              verify_live_account_flat()
              journal = bot.default_execution_journal()
              bot.save_execution_journal(journal)
          else:
              blocked_id = str(latest.get("id", ""))
              attempt = int(latest.get("run_attempt", 1))
              conclusion = str(latest.get("conclusion") or "")
              artifacts = gh_json("api", "-X", "GET",
                                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{blocked_id}/artifacts?per_page=100")
              names = {a.get("name") for a in artifacts.get("artifacts", []) if not a.get("expired", False)}
              marker_name = f"xaut-live-run-started-a{attempt}"
              state_name = f"xaut-live-state-a{attempt}"
              has_marker, has_state = marker_name in names, state_name in names

              if conclusion == "success" and has_marker and has_state:
                  subprocess.check_call(["gh", "run", "download", blocked_id,
                                         "--repo", os.environ["GITHUB_REPOSITORY"],
                                         "--name", state_name, "--dir", str(restore_dir)])
                  manifest_path = restore_dir / "state_manifest.json"
                  journal_path = restore_dir / "execution_journal.json"
                  if not manifest_path.is_file() or manifest_path.is_symlink() or not journal_path.is_file() or journal_path.is_symlink():
                      fail("previous Live state artifact is incomplete")
                  manifest = json.loads(manifest_path.read_text())
                  if manifest.get("schema_version") != 1 or manifest.get("mode") != "LIVE":
                      fail("previous artifact is not a LIVE manifest")
                  if manifest.get("symbol") != "XAUTUSD" or int(manifest.get("product_id", -1)) != 131253:
                      fail("previous manifest product identity mismatch")
                  run = manifest.get("run") or {}
                  if str(run.get("workflow_run_id", "")) != blocked_id or str(run.get("workflow_run_attempt", "")) != str(attempt):
                      fail("manifest run/attempt does not match source run")
                  records = manifest.get("files")
                  if not isinstance(records, dict) or "execution_journal.json" not in records:
                      fail("manifest is missing execution_journal.json")
                  allowed = {"execution_journal.json", "alert_state.json", "trade_history.csv", "trade_history_legacy.csv"}
                  if not set(records).issubset(allowed):
                      fail("manifest includes unexpected or Paper-only state")
                  actual_files = {p.name for p in restore_dir.iterdir() if p.is_file()}
                  if actual_files != set(records) | {"state_manifest.json"}:
                      fail("artifact file set does not match manifest")
                  for name, rec in records.items():
                      path = restore_dir / name
                      if path.is_symlink() or not isinstance(rec, dict):
                          fail(f"invalid checkpoint file: {name}")
                      digest = hashlib.sha256(path.read_bytes()).hexdigest()
                      if digest != rec.get("sha256") or path.stat().st_size != int(rec.get("size_bytes", -1)):
                          fail(f"checkpoint hash/size mismatch: {name}")
                  journal = json.loads(journal_path.read_text())
                  if journal.get("version") != 1 or journal.get("symbol") != "XAUTUSD" or int(journal.get("product_id", -1)) != 131253:
                      fail("execution journal schema/product mismatch")
                  if float(journal.get("managed_position", 999)) != 0.0 or journal.get("pending_order") is not None:
                      fail("previous Live run did not finish flat with no pending order")
                  for name in records:
                      shutil.copy2(restore_dir / name, Path(name))
                  print(f"RESTORED VERIFIED LIVE FLAT CHECKPOINT: run {blocked_id}, attempt {attempt}")
                  verify_live_account_flat()
              else:
                  if os.environ.get("MANUAL_RECOVERY") != "true":
                      fail(f"latest Live run {blocked_id} attempt {attempt} is incomplete (conclusion={conclusion!r}, marker={has_marker}, state={has_state}); manual flat-account recovery is required")
                  if os.environ.get("BLOCKED_RUN_ID_INPUT", "") != blocked_id:
                      fail("blocked_run_id input must exactly match the latest interrupted Live run ID")
                  if os.environ.get("MANUAL_RECOVERY_CONFIRMATION", "") != "RECOVER_XAUTUSD_LIVE_AFTER_MANUAL_FLAT":
                      fail("exact manual-recovery confirmation is missing")
                  print(f"MANUAL LIVE RECOVERY APPROVED FOR BLOCKED RUN {blocked_id}; verifying exchange flat state before reinitializing journal.")
                  verify_live_account_flat()
                  journal = bot.default_execution_journal()
                  bot.save_execution_journal(journal)

          # Final pre-entry guard: restored/new journal must be flat and have no pending intent.
          journal = bot.load_execution_journal()[0]
          if float(journal.get("managed_position", 999)) != 0.0 or journal.get("pending_order") is not None:
              fail("execution journal is not flat/clean before the Live pilot")
          verify_live_account_flat()
          print("LIVE EXECUTION JOURNAL READY: managed_position=0; pending_order=null.")
          PY

      - name: Prepare Live run-start marker
        id: prepare_marker
        timeout-minutes: 2
        env:
          BOT_COMMIT_SHA: ${{ env.BOT_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "bot_commit": os.environ.get("BOT_COMMIT_SHA", ""),
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "mode": "LIVE", "symbol": "XAUTUSD", "product_id": 131253,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "xaut-live-run-started.json"), "w") as f:
              json.dump(payload, f, separators=(",", ":"))
          print("Live run-start marker prepared; no API secrets stored.")
          PY

      - name: Upload Live run-start marker
        id: upload_marker
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: xaut-live-run-started-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/xaut-live-run-started.json
          if-no-files-found: error
          retention-days: 30

      - name: Run supervised Live bot (5-minute pilot)
        id: run_bot
        if: steps.upload_marker.outcome == 'success'
        timeout-minutes: 25
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: "true"
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          BOT_RUNTIME_MINUTES: "5"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM || secrets.SMTP_USER }}
        run: python -u private-bot/bot.py

      - name: Validate flat Live state and prepare checkpoint
        id: checkpoint
        if: always() && steps.upload_marker.outcome == 'success' && steps.run_bot.outcome == 'success'
        timeout-minutes: 7
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ENABLE_LIVE_TRADING: "true"
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.util, json, os, shutil
          from pathlib import Path

          def fail(msg): raise SystemExit("LIVE CHECKPOINT REJECTED: " + msg)
          p = Path("state_manifest.json")
          j = Path("execution_journal.json")
          if not p.is_file() or p.is_symlink() or not j.is_file() or j.is_symlink():
              fail("LIVE manifest or execution journal is missing")
          m = json.loads(p.read_text())
          if m.get("schema_version") != 1 or m.get("mode") != "LIVE" or m.get("symbol") != "XAUTUSD" or int(m.get("product_id", -1)) != 131253:
              fail("manifest mode/identity mismatch")
          run = m.get("run") or {}
          if str(run.get("workflow_run_id", "")) != os.environ["GITHUB_RUN_ID"] or str(run.get("workflow_run_attempt", "")) != os.environ["GITHUB_RUN_ATTEMPT"]:
              fail("manifest run/attempt mismatch")
          records = m.get("files")
          allowed = {"execution_journal.json", "alert_state.json", "trade_history.csv", "trade_history_legacy.csv"}
          if not isinstance(records, dict) or "execution_journal.json" not in records or not set(records).issubset(allowed):
              fail("manifest file map is malformed or contains Paper state")
          root_files = {x.name for x in Path(".").iterdir() if x.is_file() and x.name in (allowed | {"paper_state.json"})}
          if root_files != set(records) or "paper_state.json" in root_files:
              fail("runtime state files do not exactly match LIVE manifest (or Paper state is present)")
          for name, rec in records.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file() or not isinstance(rec, dict): fail(f"invalid file {name}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != rec.get("sha256") or path.stat().st_size != int(rec.get("size_bytes", -1)):
                  fail(f"hash/size mismatch for {name}")
          journal = json.loads(j.read_text())
          if journal.get("version") != 1 or journal.get("symbol") != "XAUTUSD" or int(journal.get("product_id", -1)) != 131253:
              fail("execution journal identity mismatch")
          if float(journal.get("managed_position", 999)) != 0.0 or journal.get("pending_order") is not None:
              fail("bot did not finish with flat position and no unresolved order")

          spec = importlib.util.spec_from_file_location("xaut_live_checkpoint_verify", "private-bot/bot.py")
          bot = importlib.util.module_from_spec(spec); spec.loader.exec_module(bot)
          if bot.LIVE_TRADING is not True or bot.PAPER_MODE is not False: fail("Live environment guard is not active")
          bot.validate_product_identity()
          pos = bot.read_stable_position()
          orders = bot.get_open_orders()
          if pos is None or abs(float(pos)) > bot.POSITION_TOLERANCE: fail(f"post-run exchange position not flat: {pos}")
          if orders is None or orders: fail("post-run active orders are not verified empty")
          print("POST-RUN DELTA VERIFICATION PASSED: XAUTUSD flat; no active orders.")

          out = Path("live-state-artifact")
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          for name in records:
              shutil.copy2(name, out / name)
          shutil.copy2(p, out / "state_manifest.json")
          print("VERIFIED LIVE CHECKPOINT READY:", ", ".join(sorted(set(records) | {"state_manifest.json"})))
          PY

      - name: Upload verified Live state
        id: upload_live_state
        if: steps.checkpoint.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: xaut-live-state-a${{ github.run_attempt }}
          path: live-state-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded Live checkpoint is visible
        if: steps.upload_live_state.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload_live_state.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: xaut-live-state-a${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            DATA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
            if printf '%s' "$DATA" | jq -e --arg id "$EXPECTED_ARTIFACT_ID" --arg name "$EXPECTED_ARTIFACT_NAME" \
              'any(.artifacts[]?; (.id|tostring)==$id and .name==$name and .expired==false)' >/dev/null; then
              echo "Verified Live checkpoint artifact: $EXPECTED_ARTIFACT_NAME (ID $EXPECTED_ARTIFACT_ID)."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Live checkpoint upload could not be verified."; exit 1
