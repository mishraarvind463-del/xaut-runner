name: XAUTUSD Offline Safety Tests
run-name: XAUTUSD Offline Safety Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private bot source
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --retries 5 --timeout 30
          python -m pip install --retries 5 --timeout 30 -r private-bot/requirements.txt
          python -m pip check

      - name: Compile bot without running it
        shell: bash
        run: python -m py_compile private-bot/bot.py

      - name: Run offline pre-live regression tests
        shell: bash
        run: python tests/test_pre_live_suite.py private-bot/bot.py

      - name: Run isolated forced-interruption simulation
        shell: bash
        run: python tests/test_forced_interruption_simulation.py private-bot/bot.py

      - name: Run Live execution mock tests (no exchange calls)
        shell: bash
        run: python tests/test_live_mock_suite.py private-bot/bot.py
