name: Manual Recovery - XAUTUSD Paper State
run-name: Manual Recovery - XAUTUSD Paper State

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Older Setup A or Setup B run ID that contains the checkpoint to restore"
        required: true
        type: string
      source_attempt:
        description: "Exact attempt number that created that checkpoint (usually 1)"
        required: true
        type: string
      confirmation:
        description: "Type RESTORE_XAUTUSD_PAPER_STATE to approve this Paper-state rollback"
        required: true
        type: string

permissions:
  actions: read
  contents: read

# Manual recovery must serialize with both bot workflows.
concurrency:
  group: xaut-trading-bot-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  approve-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        timeout-minutes: 10
        with:
          python-version: "3.12"

      - name: Validate exact blocked Setup A/B run and selected older checkpoint
        timeout-minutes: 10
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/xaut_ci.py approve \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-attempt "$SOURCE_ATTEMPT" \
            --confirmation "$CONFIRMATION" \
            --output approved-recovery

      - name: Upload approved recovery checkpoint bundle
        id: upload_recovery
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: xaut-manual-recovery-approved-r${{ github.run_attempt }}
          path: approved-recovery/
          if-no-files-found: error
          retention-days: 30

      - name: Verify approved recovery artifact is visible
        timeout-minutes: 5
        env:
          EXPECTED_ARTIFACT_ID: ${{ steps.upload_recovery.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: xaut-manual-recovery-approved-r${{ github.run_attempt }}
        run: python scripts/xaut_ci.py verify-upload
