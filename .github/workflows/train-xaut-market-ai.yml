name: Train XAUT Market AI (Offline)

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Historical data window
        required: true
        type: choice
        options: ["30", "90", "180"]
        default: "90"
      sample_every_minutes:
        description: Feature sampling interval
        required: true
        type: choice
        options: ["5", "10", "15"]
        default: "5"
      target_atr_fraction:
        description: Future move threshold as a fraction of current ATR
        required: true
        type: choice
        options: ["0.25", "0.50", "0.75"]
        default: "0.50"
      cost_buffer_bps:
        description: Optional additional deadband floor (not a fee estimate)
        required: true
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: xaut-market-ai-offline-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Checkout private bot research code
        uses: actions/checkout@v4
        with:
          repository: mishraarvind463-del/xaut-bot
          token: ${{ secrets.BOT_REPO_TOKEN }}
          path: private-bot
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: private-bot/requirements-research.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r private-bot/requirements-research.txt

      - name: Verify offline market AI tests
        working-directory: private-bot
        run: python -m unittest -v test_market_ai.py

      - name: Download XAUTUSD history and train research candidate
        working-directory: private-bot
        run: >-
          python offline_market_trainer.py
          --days "${{ inputs.lookback_days }}"
          --sample-every-minutes "${{ inputs.sample_every_minutes }}"
          --target-atr-fraction "${{ inputs.target_atr_fraction }}"
          --cost-buffer-bps "${{ inputs.cost_buffer_bps }}"
          --output-dir market_ai_output

      - name: Verify event research outputs
        working-directory: private-bot
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          out = Path("market_ai_output")
          required = [
              out / "xaut_market_event_dataset.csv.gz",
              out / "xaut_market_event_model_candidate.json",
              out / "training_report.json",
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"Required research output missing or empty: {path}")

          report = json.loads((out / "training_report.json").read_text(encoding="utf-8"))
          integrity = report.get("event_dataset_integrity", {})
          if integrity.get("verified") is not True:
              raise SystemExit("Event dataset integrity verification is absent or failed")
          if integrity.get("file") != "xaut_market_event_dataset.csv.gz":
              raise SystemExit("Unexpected event dataset path in training report")
          if integrity.get("rows", 0) <= 0 or not integrity.get("sha256"):
              raise SystemExit("Event dataset row count or SHA256 is invalid")

          event_models = report.get("event_models", {})
          trained = [h for h, result in event_models.items() if result.get("status") == "TRAINED"]
          if not trained:
              raise SystemExit("No event horizon model was trained")
          print(f"Event dataset verified: {integrity['rows']:,} rows; trained horizons: {', '.join(trained)}")
          PYCODE

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaut-market-ai-research-${{ github.run_id }}
          path: |
            private-bot/market_ai_output/training_report.json
            private-bot/market_ai_output/xaut_market_model_candidate.json
            private-bot/market_ai_output/xaut_market_feature_dataset.csv.gz
            private-bot/market_ai_output/xaut_market_event_dataset.csv.gz
            private-bot/market_ai_output/xaut_market_event_model_candidate.json
            private-bot/market_ai_output/xaut_market_event_*_candidate.joblib
            private-bot/market_ai_output/xaut_market_[0-9]*m_candidate.joblib
            private-bot/market_ai_output/supertrend_replay_trades.csv
            private-bot/market_ai_output/xautusd_mark_1m_history.csv.gz
          if-no-files-found: error
          retention-days: 30
